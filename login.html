<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - iACADEMY Fleet Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { blue: '#1e3a8a', bg: '#f8fafc' } } } } };

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans min-h-screen flex items-center justify-center p-6 relative overflow-y-auto custom-scrollbar transition-colors duration-300">
    
    <button onclick="toggleTheme()" class="absolute top-6 right-6 z-20 text-white/70 hover:text-white dark:text-gray-400 dark:hover:text-yellow-400 text-2xl transition-colors drop-shadow-md">
        <i class="fa-solid fa-moon dark:hidden"></i>
        <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
    </button>

    <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 dark:from-gray-800 dark:via-blue-900 dark:to-gray-900 z-0 transition-colors duration-300"></div>

    <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700 relative z-10 transition-colors duration-300 my-8">
        
        <div class="text-center mb-8 pt-6">
    <i class="fa-solid fa-building-shield text-5xl text-blue-800 mb-3"></i>
    <h1 class="text-2xl font-black text-gray-800 tracking-tight">iACADEMY <span class="font-light text-blue-600">FLEET</span></h1>
    <p class="text-[10px] font-bold text-gray-500 tracking-widest uppercase mt-1">MANAGEMENT SYSTEM</p>
</div>

        <form id="loginForm" class="p-8 space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500"></i>
                    <input type="text" id="username" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl pl-11 p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 transition-all text-blue-900 dark:text-white" placeholder="Enter username">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500"></i>
                    <input type="password" id="password" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl pl-11 pr-11 p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 transition-all text-blue-900 dark:text-white" placeholder="••••••••">
                    <button type="button" onclick="togglePassword('password', 'loginToggleIcon')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none transition-colors">
                        <i id="loginToggleIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between pt-1">
                <a href="forgot-password.html" class="text-xs font-bold text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors">Forgot password?</a>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-blue-800 dark:bg-blue-600 hover:bg-blue-900 dark:hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition-colors mt-6 text-sm uppercase tracking-wider disabled:opacity-50 disabled:cursor-not-allowed">
                Sign In to Portal
            </button>
            
            <p class="text-center text-xs text-gray-500 dark:text-gray-400 mt-6 font-medium">
                Don't have a driver account? <a href="signup.html" class="text-blue-700 dark:text-blue-400 font-bold hover:underline transition-colors">Register Here</a>
            </p>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('verified') === 'success') {
            const formContainer = document.getElementById('loginForm');
            const successBanner = document.createElement('div');
            successBanner.className = "bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-400 text-xs font-bold p-3 rounded-xl mb-6 text-center transition-colors";
            successBanner.innerHTML = "<i class='fa-solid fa-check-circle mr-1'></i> Email successfully verified! You may now log in.";
            formContainer.prepend(successBanner);
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        const savedToken = localStorage.getItem('token');
        const savedRole = localStorage.getItem('userRole');

        if (savedToken && savedRole) {
            if (savedRole === 'superadmin') window.location.href = 'superadmin-dashboard.html';
            else if (savedRole === 'admin') window.location.href = 'dashboard.html';
            else window.location.href = 'driver-dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('btnSubmit');
            
            const originalText = submitBtn.innerText;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Authenticating...`;
            submitBtn.disabled = true;

            try {
                const response = await fetch('https://iacademy-rfid.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.isVerified === false) {
                        alert("Please verify your email address before logging in.");
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                        return;
                    }

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userRole', data.role);
                    
                    localStorage.setItem('username', data.username); 
                    
                    if (data.department) localStorage.setItem('userDept', data.department);

                    if (data.role === 'superadmin') window.location.href = 'superadmin-dashboard.html';
                    else if (data.role === 'admin') window.location.href = 'dashboard.html';
                    else window.location.href = 'driver-dashboard.html';
                } else {
                    alert(data.message || 'Login failed. Please check your credentials.');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Server error. Make sure your backend is running!');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('PWA Ready!');
                }).catch(error => {
                    console.log('PWA Failed: ', error);
                });
            });
        }
    </script>
</body>
</html>
