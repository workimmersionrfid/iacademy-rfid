<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Logs - iACADEMY RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />

    <style>
        .daterangepicker .ranges li.active { background-color: #1e3a8a !important; }
        .daterangepicker td.active, .daterangepicker td.active:hover { background-color: #1e3a8a !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { blue: '#1e3a8a', bg: '#f8fafc' } }
                }
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem('token');
            if (!token) window.location.href = 'login.html';
        });
    </script>
</head>
<body class="bg-brand-bg font-sans min-h-screen text-gray-800 antialiased">

    <div id="shared-nav"></div>

    <main class="max-w-[1400px] mx-auto px-6 py-8 space-y-8">
        
        <div class="bg-gradient-to-r from-blue-800 via-blue-400 to-blue-50 rounded-2xl shadow-md p-8 md:p-12 relative overflow-hidden flex items-center justify-between">
            <div class="relative z-10">
                <p class="text-blue-100 text-sm font-medium mb-1 tracking-wide uppercase">Fleet Financials</p>
                <h1 class="text-3xl md:text-4xl font-bold text-white tracking-tight">Mileage & Toll Records</h1>
                <p class="text-blue-50 mt-2 max-w-lg text-sm">Monitor combined fuel consumption, toll expenses, and total fleet expenditure.</p>
            </div>
            <div class="hidden md:block relative z-10 text-white/20">
                <i class="fa-solid fa-money-check-dollar text-9xl"></i>
            </div>
        </div>

        <div id="adminFilters" class="hidden bg-white rounded-2xl shadow-md border border-blue-50 p-6 flex flex-col gap-4">
            <div class="flex flex-col md:flex-row gap-4 items-end">
                <div class="w-full md:w-1/4">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Filter by Department</label>
                    <select id="filterDept" onchange="applyFuelFilters()" class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:border-blue-500 bg-white">
                        <option value="">All Departments</option>
                        <option value="ELPD">ELPD</option>
                        <option value="OSAS">OSAS</option>
                        <option value="IT">IT</option>
                        <option value="REGISTRAR">REGISTRAR</option>
                        <option value="FINANCE">FINANCE</option>
                        <option value="ADMISSIONS">ADMISSIONS</option>
                        <option value="ADCOM">ADCOM</option>
                        <option value="CLINIC">CLINIC</option>
                        <option value="PURCHASING">PURCHASING</option>
                        <option value="ADMIN">ADMIN</option>
                        <option value="SHS">SHS</option>
                        <option value="COLLEGE">COLLEGE</option>
                        <option value="LIBRARY">LIBRARY</option>
                    </select>
                </div>

                <div class="w-full md:w-1/4">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Filter by Driver</label>
                    <select id="filterDriver" onchange="applyFuelFilters()" class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:border-blue-500 bg-white">
                        <option value="">All Drivers</option>
                    </select>
                </div>
                
                <div class="w-full md:w-1/4">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Date Range</label>
                    <div class="relative">
                        <i class="fa-regular fa-calendar absolute left-3 top-1/2 -translate-y-1/2 text-blue-500"></i>
                        <input type="text" id="dateRangePicker" class="w-full border border-gray-200 rounded-xl py-3 pl-10 pr-3 text-sm outline-none focus:border-blue-500 bg-white font-medium text-blue-900 cursor-pointer" placeholder="Select date range...">
                    </div>
                </div>

                <div class="w-full md:w-1/4 flex gap-2">
                    <button onclick="applyFuelFilters(true)" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-3 rounded-xl transition-colors text-sm">Clear Filters</button>
                    <button onclick="exportFuelToExcel()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-colors text-sm shadow-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-file-excel"></i> Export
                    </button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded-2xl shadow-md p-6 border border-blue-50 flex items-center gap-5">
                <div class="bg-blue-50 text-blue-600 w-14 h-14 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-receipt"></i></div>
                <div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Total Records</p>
                    <h3 id="statTotalLogs" class="text-3xl font-black text-blue-900">0</h3>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-md p-6 border border-blue-50 flex items-center gap-5">
                <div class="bg-blue-50 text-blue-600 w-14 h-14 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-droplet"></i></div>
                <div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Total Liters Pumped</p>
                    <h3 id="statTotalLiters" class="text-3xl font-black text-blue-900">0 L</h3>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-md p-6 border border-blue-50 flex items-center gap-5">
                <div class="bg-blue-50 text-blue-600 w-14 h-14 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-peso-sign"></i></div>
                <div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Total Expenditure</p>
                    <h3 id="statTotalCost" class="text-3xl font-black text-blue-900">₱0.00</h3>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-md border border-blue-50 overflow-hidden relative">
            <div class="absolute top-0 left-0 w-1 h-full bg-blue-800"></div>
            
            <div class="p-6 border-b border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
                <h2 class="font-bold text-xl text-blue-900">Detailed Financial Logs</h2>
                <button onclick="loadFuelLogs()" class="text-sm font-bold text-blue-600 hover:text-blue-800"><i class="fa-solid fa-rotate-right mr-1"></i> Refresh Data</button>
            </div>

            <div class="overflow-x-auto max-h-[600px] overflow-y-auto custom-scrollbar p-2">
                <table class="w-full text-left border-collapse min-w-[900px]">
                    <thead class="sticky top-0 bg-white z-10 shadow-sm">
                        <tr class="border-b border-gray-100 text-xs text-gray-400 uppercase tracking-widest">
                            <th class="p-4 font-bold">Date</th>
                            <th class="p-4 font-bold">Type & Driver</th>
                            <th class="p-4 font-bold">Expense Details</th>
                            <th class="p-4 font-bold text-right">Cost</th>
                        </tr>
                    </thead>
                    <tbody id="fuelLogsTable" class="text-sm divide-y divide-gray-50">
                        <tr><td colspan="4" class="p-12 text-center text-blue-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i><br>Loading records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        const API_BASE = 'https://iacademy-rfid.onrender.com/api'; 
        let allLogs = [];
        let filteredLogs = [];
        let allDrivers = []; 
        
        const userRole = localStorage.getItem('userRole');
        const currentUser = localStorage.getItem('username');

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof renderNavigation === 'function') renderNavigation('fuel-log');
            if (userRole === 'admin') document.getElementById('adminFilters').classList.remove('hidden');
            
            $('#dateRangePicker').daterangepicker({
                opens: 'left', autoUpdateInput: false,
                locale: { format: 'MM/DD/YYYY', cancelLabel: 'Clear' },
                ranges: {
                    'Today': [moment(), moment()],
                    'Yesterday': [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
                    'Month to date': [moment().startOf('month'), moment()],
                    'Last week': [moment().subtract(1, 'week').startOf('isoWeek'), moment().subtract(1, 'week').endOf('isoWeek')],
                    'Last month': [moment().subtract(1, 'month').startOf('month'), moment().subtract(1, 'month').endOf('month')]
                }
            });

            $('#dateRangePicker').on('apply.daterangepicker', function(ev, picker) {
                $(this).val(picker.startDate.format('MM/DD/YYYY') + ' - ' + picker.endDate.format('MM/DD/YYYY'));
                applyFuelFilters(); 
            });

            $('#dateRangePicker').on('cancel.daterangepicker', function(ev, picker) {
                $(this).val('');
                applyFuelFilters(); 
            });

            loadFuelLogs();
        });

        // REVISION: Load Both Fuel and Tolls
        async function loadFuelLogs() {
            try {
                const [logsRes, tollsRes, driversRes] = await Promise.all([
                    fetch(`${API_BASE}/logs`),
                    fetch(`${API_BASE}/tolls`),
                    fetch(`${API_BASE}/drivers`)
                ]);
                
                const fLogs = await logsRes.json();
                const tLogs = await tollsRes.json();
                allDrivers = await driversRes.json();

                const formattedFuel = fLogs.map(l => ({...l, logType: 'Fuel'}));
                const formattedToll = tLogs.map(l => ({...l, logType: 'Toll'}));
                
                // Combine and sort by date
                allLogs = [...formattedFuel, ...formattedToll].sort((a, b) => new Date(b.date) - new Date(a.date));

                const driverSelect = document.getElementById('filterDriver');
                if(driverSelect) {
                    allDrivers.forEach(d => {
                        if(![...driverSelect.options].some(opt => opt.value === d.username)) {
                            driverSelect.innerHTML += `<option value="${d.username}">${d.username}</option>`;
                        }
                    });
                }

                if (userRole !== 'admin') {
                    allLogs = allLogs.filter(log => log.driver === currentUser);
                }
                
                applyFuelFilters();
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('fuelLogsTable').innerHTML = `<tr><td colspan="4" class="p-12 text-center text-red-500 font-bold">Failed to load records.</td></tr>`;
            }
        }

        function applyFuelFilters(clear = false) {
            if (clear) {
                document.getElementById('filterDept').value = "";
                document.getElementById('filterDriver').value = ""; 
                $('#dateRangePicker').val('');
            }

            const deptFilter = document.getElementById('filterDept') ? document.getElementById('filterDept').value : "";
            const driverFilter = document.getElementById('filterDriver') ? document.getElementById('filterDriver').value : ""; 
            
            const isDateSelected = $('#dateRangePicker').val() !== '';
            let startBoundary = null;
            let endBoundary = null;

            if (isDateSelected) {
                const datePicker = $('#dateRangePicker').data('daterangepicker');
                startBoundary = datePicker.startDate.toDate();
                endBoundary = datePicker.endDate.toDate();
                startBoundary.setHours(0, 0, 0, 0);
                endBoundary.setHours(23, 59, 59, 999);
            }

            filteredLogs = allLogs.filter(log => {
                let match = true;
                
                if (deptFilter && !log.department.includes(deptFilter)) match = false;
                if (driverFilter && log.driver !== driverFilter) match = false;

                if (startBoundary && endBoundary) {
                    const logDate = new Date(log.date + "T12:00:00"); 
                    if (logDate < startBoundary || logDate > endBoundary) match = false;
                }

                return match;
            });

            renderLogsTable(filteredLogs);
        }

        function renderLogsTable(logsToDisplay) {
            const tableBody = document.getElementById('fuelLogsTable');
            document.getElementById('statTotalLogs').innerText = logsToDisplay.length;
            
            let totalLiters = 0, totalCost = 0;

            if (logsToDisplay.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-12 text-center text-gray-400 text-sm font-medium">No logs match your search.</td></tr>`;
                document.getElementById('statTotalLiters').innerText = "0 L";
                document.getElementById('statTotalCost').innerText = "₱0.00";
                return;
            }

            tableBody.innerHTML = logsToDisplay.map(l => {
                const isFuel = l.logType === 'Fuel';
                const cost = isFuel ? (parseFloat(l.total) || 0) : (parseFloat(l.amount) || 0);
                totalCost += cost;
                
                if (isFuel) totalLiters += (parseFloat(l.liters) || 0);

                const icon = isFuel ? '<i class="fa-solid fa-gas-pump text-blue-500"></i>' : '<i class="fa-solid fa-ticket text-orange-500"></i>';
                const badgeClass = isFuel ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-orange-50 text-orange-700 border-orange-200';
                const typeLabel = isFuel ? 'FUEL' : 'TOLL';

                let detailHTML = '';
                if (isFuel) {
                    const odoText = l.odo ? `ODO: ${l.odo.toLocaleString()} km` : 'ODO: N/A';
                    detailHTML = `
                        <div class="text-gray-800 font-bold flex items-center">${l.vehicle} ${l.notes ? `<i class="fa-solid fa-message text-blue-400 ml-2" title="${l.notes}"></i>` : ''}</div>
                        <div class="text-[10px] text-gray-500 mt-1 uppercase tracking-wider font-semibold">
                            <i class="fa-solid fa-gauge-high mr-1 text-gray-400"></i> ${odoText} &bull; <span class="text-blue-700">${l.liters}L ${l.fuelType || ''}</span>
                        </div>
                    `;
                } else {
                    detailHTML = `
                        <div class="text-gray-800 font-bold flex items-center">${l.vehicle} ${l.notes ? `<i class="fa-solid fa-message text-orange-400 ml-2" title="${l.notes}"></i>` : ''}</div>
                        <div class="text-[10px] text-gray-500 mt-1 uppercase tracking-wider font-semibold">
                            <i class="fa-solid fa-road mr-1 text-gray-400"></i> Route: ${l.expressway || 'Toll Road'}
                        </div>
                    `;
                }

                return `
                <tr class="hover:bg-blue-50/30 transition-colors">
                    <td class="p-4"><span class="bg-gray-100 text-gray-600 font-bold px-3 py-1 rounded-md border border-gray-200 tracking-widest text-[10px] uppercase">${l.date}</span></td>
                    <td class="p-4">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-widest border ${badgeClass}">${icon} ${typeLabel}</span>
                        </div>
                        <span class="text-xs font-bold text-gray-800">${l.driver} <span class="text-gray-400 font-normal ml-1">(${l.department})</span></span>
                    </td>
                    <td class="p-4">
                        ${detailHTML}
                    </td>
                    <td class="p-4 text-right font-black text-blue-900 text-base">₱${cost.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                </tr>`;
            }).join('');

            document.getElementById('statTotalLiters').innerText = `${totalLiters.toFixed(2)} L`;
            document.getElementById('statTotalCost').innerText = `₱${totalCost.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        // REVISION: Export Combines Fuel and Tolls
        function exportFuelToExcel() {
            if (filteredLogs.length === 0) return alert("No data to export!");
            const exportData = filteredLogs.map(log => {
                const isFuel = log.logType === 'Fuel';
                return {
                    "Date": log.date, 
                    "Expense Type": log.logType,
                    "Department": log.department, 
                    "Driver": log.driver,
                    "Vehicle": log.vehicle, 
                    "Odometer / Route": isFuel ? (log.odo || "N/A") : (log.expressway || "N/A"), 
                    "Fuel Type": isFuel ? log.fuelType : "N/A",
                    "Liters": isFuel ? log.liters : "N/A", 
                    "Price per Liter": isFuel ? log.price : "N/A", 
                    "Total Cost (PHP)": isFuel ? log.total : log.amount,
                    "Station": isFuel ? (log.station || "N/A") : "N/A", 
                    "Notes": log.notes || ""
                };
            });
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Financial Logs");
            XLSX.writeFile(workbook, `Fleet_Financials_${new Date().toISOString().split('T')[0]}.xlsx`);
        }
    </script>
</body>
</html>
