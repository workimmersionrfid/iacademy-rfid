<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Log - iACADEMY RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { blue: '#1e3a8a', bg: '#f8fafc' } }
                }
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem('token');
            if (!token) window.location.href = 'login.html';
        });
    </script>
</head>
<body class="bg-brand-bg font-sans min-h-screen text-gray-800 antialiased">

    <div id="shared-nav"></div>

    <main class="max-w-[1400px] mx-auto px-6 py-8 space-y-8">
        
        <div class="bg-gradient-to-r from-blue-800 via-blue-400 to-blue-50 rounded-2xl shadow-md p-8 md:p-12 relative overflow-hidden flex items-center justify-between">
            <div class="relative z-10">
                <p class="text-blue-100 text-sm font-medium mb-1 tracking-wide uppercase">Fleet Financials</p>
                <h1 class="text-3xl md:text-4xl font-bold text-white tracking-tight">Mileage & Fuel Records</h1>
                <p class="text-blue-50 mt-2 max-w-lg text-sm">Monitor fuel consumption, station data, and total fleet expenditure.</p>
            </div>
            <div class="hidden md:block relative z-10 text-white/20">
                <i class="fa-solid fa-gas-pump text-9xl"></i>
            </div>
        </div>

        <div id="adminFilters" class="hidden bg-white rounded-2xl shadow-md border border-blue-50 p-6 flex flex-col gap-4">
            <div class="flex flex-col md:flex-row gap-4 items-end">
                <div class="w-full md:w-1/4">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Filter by Department</label>
                    <select id="filterDept" onchange="applyFuelFilters()" class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:border-blue-500 bg-white">
                        <option value="">All Departments</option>
                        <option value="ELPD">ELPD</option>
                        <option value="OSAS">OSAS</option>
                        <option value="IT">IT</option>
                        <option value="REGISTRAR">REGISTRAR</option>
                        <option value="FINANCE">FINANCE</option>
                        <option value="ADMISSIONS">ADMISSIONS</option>
                        <option value="ADCOM">ADCOM</option>
                        <option value="CLINIC">CLINIC</option>
                        <option value="PURCHASING">PURCHASING</option>
                        <option value="ADMIN">ADMIN</option>
                        <option value="SHS">SHS</option>
                        <option value="COLLEGE">COLLEGE</option>
                        <option value="LIBRARY">LIBRARY</option>
                    </select>
                </div>
                
                <div class="w-full md:w-1/4">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Date Range</label>
                    <select id="filterDatePreset" onchange="toggleCustomDates(); applyFuelFilters();" class="w-full border border-gray-200 rounded-xl p-3 text-sm outline-none focus:border-blue-500 bg-white font-medium text-blue-900">
                        <option value="">All Time</option>
                        <option value="today">Today</option>
                        <option value="yesterday">Yesterday</option>
                        <option value="7days">Last 7 Days</option>
                        <option value="thisWeek">This Week</option>
                        <option value="thisMonth">This Month</option>
                        <option value="lastMonth">Last Month</option>
                        <option value="thisYear">This Year</option>
                        <option value="custom">Custom Range...</option>
                    </select>
                </div>

                <div class="w-full md:w-1/4 flex gap-2">
                    <button onclick="applyFuelFilters(true)" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-3 rounded-xl transition-colors text-sm">Clear Filters</button>
                    <button onclick="exportFuelToExcel()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-colors text-sm shadow-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-file-excel"></i> Export
                    </button>
                </div>
            </div>

            <div id="customDateRow" class="hidden flex-col md:flex-row gap-4 items-end pt-2 border-t border-gray-100 mt-2">
                <div class="w-full md:w-1/4">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Start Date</label>
                    <input type="date" id="filterStart" onchange="applyFuelFilters()" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
                </div>
                <div class="w-full md:w-1/4">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">End Date</label>
                    <input type="date" id="filterEnd" onchange="applyFuelFilters()" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded-2xl shadow-md p-6 border border-blue-50 flex items-center gap-5">
                <div class="bg-blue-50 text-blue-600 w-14 h-14 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-receipt"></i></div>
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Total Records</p>
                    <h3 id="statTotalLogs" class="text-3xl font-black text-blue-900">0</h3>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-md p-6 border border-blue-50 flex items-center gap-5">
                <div class="bg-blue-50 text-blue-600 w-14 h-14 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-droplet"></i></div>
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Total Liters Pumped</p>
                    <h3 id="statTotalLiters" class="text-3xl font-black text-blue-900">0 L</h3>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-md p-6 border border-blue-50 flex items-center gap-5">
                <div class="bg-blue-50 text-blue-600 w-14 h-14 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-peso-sign"></i></div>
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Total Expenditure</p>
                    <h3 id="statTotalCost" class="text-3xl font-black text-blue-900">₱0.00</h3>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-md border border-blue-50 overflow-hidden relative">
            <div class="absolute top-0 left-0 w-1 h-full bg-blue-800"></div>
            
            <div class="p-6 border-b border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
                <h2 class="font-bold text-xl text-blue-900">Detailed Fuel Log</h2>
                <button onclick="loadFuelLogs()" class="text-sm font-bold text-blue-600 hover:text-blue-800"><i class="fa-solid fa-rotate-right mr-1"></i> Refresh Data</button>
            </div>

            <div class="overflow-x-auto max-h-[600px] overflow-y-auto custom-scrollbar p-2">
                <table class="w-full text-left border-collapse min-w-[900px]">
                    <thead class="sticky top-0 bg-white z-10 shadow-sm">
                        <tr class="border-b border-gray-100 text-xs text-gray-400 uppercase tracking-widest">
                            <th class="p-4 font-bold">Date</th>
                            <th class="p-4 font-bold">Vehicle & ODO</th>
                            <th class="p-4 font-bold">Driver / Dept</th>
                            <th class="p-4 font-bold">Station & Notes</th>
                            <th class="p-4 font-bold text-right">Fuel Details</th>
                            <th class="p-4 font-bold text-right">Total Cost</th>
                        </tr>
                    </thead>
                    <tbody id="fuelLogsTable" class="text-sm divide-y divide-gray-50">
                        <tr><td colspan="6" class="p-12 text-center text-blue-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i><br>Loading records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        let allLogs = [];
        let filteredLogs = [];
        const userRole = localStorage.getItem('userRole');
        const currentUser = localStorage.getItem('username');

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof renderNavigation === 'function') renderNavigation('fuel-log');
            if (userRole === 'admin') document.getElementById('adminFilters').classList.remove('hidden');
            loadFuelLogs();
        });

        function toggleCustomDates() {
            const preset = document.getElementById('filterDatePreset').value;
            const customRow = document.getElementById('customDateRow');
            if (preset === 'custom') customRow.classList.remove('hidden');
            else customRow.classList.add('hidden');
        }

        // Calculates exact date bounds based on preset selected
        function getDateRange(preset) {
            const today = new Date();
            today.setHours(0, 0, 0, 0); // Start of today
            
            let start = new Date(today);
            let end = new Date(today);
            end.setHours(23, 59, 59, 999); // End of today

            switch(preset) {
                case 'today': break;
                case 'yesterday':
                    start.setDate(start.getDate() - 1);
                    end.setDate(end.getDate() - 1);
                    break;
                case '7days':
                    start.setDate(start.getDate() - 6);
                    break;
                case 'thisWeek':
                    const day = start.getDay();
                    const diff = start.getDate() - day + (day === 0 ? -6 : 1); // Adjust to Monday
                    start.setDate(diff);
                    break;
                case 'thisMonth':
                    start.setDate(1);
                    end = new Date(start.getFullYear(), start.getMonth() + 1, 0, 23, 59, 59); // Last day
                    break;
                case 'lastMonth':
                    start.setMonth(start.getMonth() - 1);
                    start.setDate(1);
                    end = new Date(start.getFullYear(), start.getMonth() + 1, 0, 23, 59, 59);
                    break;
                case 'thisYear':
                    start.setMonth(0, 1);
                    end = new Date(start.getFullYear(), 11, 31, 23, 59, 59);
                    break;
                case 'custom':
                    const customStart = document.getElementById('filterStart').value;
                    const customEnd = document.getElementById('filterEnd').value;
                    if(customStart) start = new Date(customStart + "T00:00:00"); else start = null;
                    if(customEnd) end = new Date(customEnd + "T23:59:59"); else end = null;
                    break;
                default:
                    return null; // All Time
            }
            return { start, end };
        }

        async function loadFuelLogs() {
            try {
                allLogs = await getLogs();
                if (userRole !== 'admin') {
                    allLogs = allLogs.filter(log => log.driver === currentUser);
                }
                applyFuelFilters();
            } catch (error) {
                document.getElementById('fuelLogsTable').innerHTML = `<tr><td colspan="6" class="p-12 text-center text-red-500 font-bold">Failed to load records.</td></tr>`;
            }
        }

        function applyFuelFilters(clear = false) {
            if (clear) {
                document.getElementById('filterDept').value = "";
                document.getElementById('filterDatePreset').value = "";
                document.getElementById('filterStart').value = "";
                document.getElementById('filterEnd').value = "";
                toggleCustomDates();
            }

            const deptFilter = document.getElementById('filterDept') ? document.getElementById('filterDept').value : "";
            const presetFilter = document.getElementById('filterDatePreset') ? document.getElementById('filterDatePreset').value : "";
            
            const dateRange = getDateRange(presetFilter);

            filteredLogs = allLogs.filter(log => {
                let match = true;
                
                if (deptFilter && !log.department.includes(deptFilter)) match = false;
                
                if (dateRange && dateRange.start && dateRange.end) {
                    const logDate = new Date(log.date + "T12:00:00"); // Approximate mid-day for pure date strings
                    if (logDate < dateRange.start || logDate > dateRange.end) match = false;
                }

                return match;
            });

            renderLogsTable(filteredLogs);
        }

        function renderLogsTable(logsToDisplay) {
            const tableBody = document.getElementById('fuelLogsTable');
            document.getElementById('statTotalLogs').innerText = logsToDisplay.length;
            
            let totalLiters = 0, totalCost = 0;

            if (logsToDisplay.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-12 text-center text-gray-400 text-sm font-medium">No fuel logs match your search.</td></tr>`;
                document.getElementById('statTotalLiters').innerText = "0 L";
                document.getElementById('statTotalCost').innerText = "₱0.00";
                return;
            }

            tableBody.innerHTML = logsToDisplay.map(log => {
                const liters = parseFloat(log.liters) || 0;
                const cost = parseFloat(log.total) || 0;
                totalLiters += liters; totalCost += cost;

                const odoText = log.odo ? `ODO: ${log.odo.toLocaleString()} km` : 'ODO: N/A';
                const fuelTypeText = log.fuelType || 'Unknown';
                const notesText = log.notes ? `<div class="text-[10px] text-gray-400 mt-1 italic w-full max-w-[200px] truncate" title="${log.notes}">"${log.notes}"</div>` : '';

                return `
                <tr class="hover:bg-blue-50/30 transition-colors">
                    <td class="p-4"><span class="bg-gray-100 text-gray-600 font-bold px-3 py-1 rounded-md border border-gray-200 tracking-widest text-[10px] uppercase">${log.date}</span></td>
                    <td class="p-4">
                        <div class="bg-blue-50 text-blue-800 font-bold px-3 py-1.5 rounded-md border border-blue-100 tracking-wider inline-block mb-1.5">${log.vehicle}</div>
                        <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider ml-1"><i class="fa-solid fa-gauge-high mr-1"></i> ${odoText}</div>
                    </td>
                    <td class="p-4">
                        <div class="font-bold text-gray-800">${log.driver}</div>
                        <div class="text-[10px] font-bold text-blue-600 uppercase tracking-widest mt-1">${log.department}</div>
                    </td>
                    <td class="p-4 font-medium text-gray-600">
                        <div class="flex items-center"><i class="fa-solid fa-location-dot text-blue-300 mr-1.5"></i> ${log.station || 'N/A'}</div>
                        ${notesText}
                    </td>
                    <td class="p-4 text-right">
                        <div class="font-bold text-gray-800 flex justify-end items-center gap-2">
                            ${liters.toFixed(2)} L <span class="text-[10px] text-blue-700 bg-blue-100 px-1.5 py-0.5 rounded uppercase tracking-wider border border-blue-200">${fuelTypeText}</span>
                        </div>
                        <div class="text-[10px] text-gray-400 uppercase tracking-wider mt-1.5">@ ₱${(parseFloat(log.price) || 0).toFixed(2)}/L</div>
                    </td>
                    <td class="p-4 text-right font-black text-blue-900 text-base">₱${cost.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                </tr>`;
            }).join('');

            document.getElementById('statTotalLiters').innerText = `${totalLiters.toFixed(2)} L`;
            document.getElementById('statTotalCost').innerText = `₱${totalCost.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        function exportFuelToExcel() {
            if (filteredLogs.length === 0) return alert("No data to export!");
            const exportData = filteredLogs.map(log => ({
                "Date": log.date, "Department": log.department, "Driver": log.driver,
                "Vehicle": log.vehicle, "Odometer": log.odo || "N/A", "Fuel Type": log.fuelType,
                "Liters": log.liters, "Price per Liter": log.price, "Total Cost (PHP)": log.total,
                "Station": log.station || "N/A", "Notes": log.notes || ""
            }));
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Fuel Financials");
            XLSX.writeFile(workbook, `Fuel_Expenditure_${new Date().toISOString().split('T')[0]}.xlsx`);
        }
    </script>
</body>
</html>
