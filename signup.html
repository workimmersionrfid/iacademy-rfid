<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Registration - iACADEMY RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else { document.documentElement.classList.remove('dark'); }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700 animate-fade-in relative">
        <div class="absolute top-0 left-0 w-full h-1 bg-blue-600 dark:bg-blue-500"></div>
        
        <div class="p-8 text-center">
            <div class="w-16 h-16 bg-blue-50 dark:bg-blue-900/30 rounded-full flex items-center justify-center mx-auto mb-4 border border-blue-100 dark:border-blue-800">
                <i class="fa-solid fa-id-card text-2xl text-blue-600 dark:text-blue-400"></i>
            </div>
            <h2 class="text-2xl font-black text-blue-900 dark:text-white tracking-tight">Driver Registration</h2>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 font-medium">Create your account to access the dispatch portal.</p>
        </div>

        <form id="registerForm" class="px-8 pb-8 space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="regUsername" required class="w-full border border-gray-200 dark:border-gray-700 rounded-xl py-3 pl-10 pr-3 text-sm outline-none focus:border-blue-500 dark:focus:border-blue-400 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-white transition-colors" placeholder="e.g. larsen08">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">First Name</label>
                    <input type="text" id="regFirst" required class="w-full border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 dark:focus:border-blue-400 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-white transition-colors" placeholder="First">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Last Name</label>
                    <input type="text" id="regLast" required class="w-full border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 dark:focus:border-blue-400 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-white transition-colors" placeholder="Last">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Email Address</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="email" id="regEmail" required class="w-full border border-gray-200 dark:border-gray-700 rounded-xl py-3 pl-10 pr-3 text-sm outline-none focus:border-blue-500 dark:focus:border-blue-400 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-white transition-colors" placeholder="you@umak.edu.ph">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="regPassword" required class="w-full border border-gray-200 dark:border-gray-700 rounded-xl py-3 pl-10 pr-10 text-sm outline-none focus:border-blue-500 dark:focus:border-blue-400 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-white transition-colors" placeholder="••••••••">
                </div>
                <p class="text-[9px] text-gray-400 dark:text-gray-500 mt-1">Must contain 1 uppercase, 1 lowercase, 1 number, and be 8+ characters.</p>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-blue-700 dark:bg-blue-600 hover:bg-blue-800 dark:hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-colors mt-4 text-sm uppercase tracking-wide">
                Create Account
            </button>

            <div class="text-center mt-6">
                <a href="login.html" class="text-xs font-bold text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Back to Login
                </a>
            </div>
        </form>
    </div>

    <script>
        const API_BASE = 'https://iacademy-rfid.onrender.com/api';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const origText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Processing...`;
            btn.disabled = true;

            const payload = {
                username: document.getElementById('regUsername').value,
                firstName: document.getElementById('regFirst').value,
                lastName: document.getElementById('regLast').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                role: 'driver', // Hardcoded for this form
                department: ['Pending Assignment'] // Defaults to pending
            };

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert('Registration Successful! Please check your email to verify your account before logging in.');
                    window.location.href = 'login.html';
                } else {
                    alert(data.message || 'Registration failed.');
                    btn.innerHTML = origText;
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Network error connecting to the server.');
                btn.innerHTML = origText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
