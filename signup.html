<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Registration - iACADEMY Fleet Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { blue: '#1e3a8a', bg: '#f8fafc' } } } } };
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else { document.documentElement.classList.remove('dark'); }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans min-h-screen flex items-center justify-center p-6 relative overflow-y-auto custom-scrollbar transition-colors duration-300">

    <button onclick="toggleTheme()" class="absolute top-6 right-6 z-20 text-white/70 hover:text-white dark:text-gray-400 dark:hover:text-yellow-400 text-2xl transition-colors drop-shadow-md">
        <i class="fa-solid fa-moon dark:hidden"></i>
        <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
    </button>

    <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 dark:from-gray-800 dark:via-blue-900 dark:to-gray-900 z-0 transition-colors duration-300"></div>

    <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700 relative z-10 transition-colors duration-300 my-8">
        
        <div class="p-8 text-center bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 transition-colors duration-300">
            <i class="fa-solid fa-id-card text-blue-800 dark:text-blue-400 text-5xl mb-4 transition-colors"></i>
            <h1 class="text-2xl font-black text-gray-800 dark:text-white tracking-tight transition-colors">Driver Registration</h1>
            <p class="text-gray-500 dark:text-gray-400 text-xs font-bold uppercase tracking-widest mt-2 transition-colors">Create your dispatch account</p>
        </div>

        <form id="registerForm" class="p-8 space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500"></i>
                    <input type="text" id="regUsername" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl pl-11 p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 transition-all text-blue-900 dark:text-white" placeholder="e.g. larsen08">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">First Name</label>
                    <input type="text" id="regFirst" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 transition-all text-blue-900 dark:text-white" placeholder="First">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Last Name</label>
                    <input type="text" id="regLast" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 transition-all text-blue-900 dark:text-white" placeholder="Last">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Email Address</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500"></i>
                    <input type="email" id="regEmail" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl pl-11 p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 transition-all text-blue-900 dark:text-white" placeholder="you@umak.edu.ph">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500"></i>
                    <input type="password" id="regPassword" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl pl-11 pr-11 p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 transition-all text-blue-900 dark:text-white" placeholder="••••••••">
                    <button type="button" onclick="togglePassword('regPassword', 'regToggleIcon1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none transition-colors">
                        <i id="regToggleIcon1" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <ul id="passwordReqs" class="text-[10px] mt-2 space-y-1 text-gray-500 dark:text-gray-400 pl-1">
                    <li id="req-length"><i class="fa-solid fa-circle-xmark text-red-400 mr-1 w-3"></i> At least 8 characters</li>
                    <li id="req-upper"><i class="fa-solid fa-circle-xmark text-red-400 mr-1 w-3"></i> One uppercase letter</li>
                    <li id="req-lower"><i class="fa-solid fa-circle-xmark text-red-400 mr-1 w-3"></i> One lowercase letter</li>
                    <li id="req-number"><i class="fa-solid fa-circle-xmark text-red-400 mr-1 w-3"></i> One number</li>
                </ul>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Confirm Password</label>
                <div class="relative">
                    <i class="fa-solid fa-shield-check absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500"></i>
                    <input type="password" id="regConfirmPassword" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl pl-11 pr-11 p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 transition-all text-blue-900 dark:text-white" placeholder="••••••••">
                    <button type="button" onclick="togglePassword('regConfirmPassword', 'regToggleIcon2')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none transition-colors">
                        <i id="regToggleIcon2" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <p id="matchMsg" class="text-[10px] font-bold mt-1 pl-1 hidden"></p>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-blue-800 dark:bg-blue-600 hover:bg-blue-900 dark:hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition-colors mt-6 text-sm uppercase tracking-wider disabled:opacity-50 disabled:cursor-not-allowed">
                Create Account
            </button>

            <p class="text-center text-xs text-gray-500 dark:text-gray-400 mt-6 font-medium">
                Already have an account? <a href="login.html" class="text-blue-700 dark:text-blue-400 font-bold hover:underline transition-colors">Log In</a>
            </p>
        </form>
    </div>

    <script>
        const API_BASE = 'https://iacademy-rfid.onrender.com/api';

        // --- PASSWORD TOGGLE LOGIC ---
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        // --- REAL-TIME PASSWORD VALIDATION ---
        const pwInput = document.getElementById('regPassword');
        const confirmInput = document.getElementById('regConfirmPassword');
        const matchMsg = document.getElementById('matchMsg');
        const btnSubmit = document.getElementById('btnSubmit');

        function updateReq(elementId, isValid) {
            const el = document.getElementById(elementId);
            const icon = el.querySelector('i');
            if (isValid) {
                el.classList.add('text-emerald-600', 'dark:text-emerald-400');
                el.classList.remove('text-gray-500', 'dark:text-gray-400');
                icon.classList.replace('fa-circle-xmark', 'fa-circle-check');
                icon.classList.replace('text-red-400', 'text-emerald-500');
            } else {
                el.classList.remove('text-emerald-600', 'dark:text-emerald-400');
                el.classList.add('text-gray-500', 'dark:text-gray-400');
                icon.classList.replace('fa-circle-check', 'fa-circle-xmark');
                icon.classList.replace('text-emerald-500', 'text-red-400');
            }
        }

        function checkFormValidity() {
            const val = pwInput.value;
            const isLength = val.length >= 8;
            const isUpper = /[A-Z]/.test(val);
            const isLower = /[a-z]/.test(val);
            const isNum = /\d/.test(val);
            const isMatch = val !== "" && val === confirmInput.value;

            // Check if all rules are met
            if (isLength && isUpper && isLower && isNum && isMatch) {
                btnSubmit.disabled = false;
            } else {
                btnSubmit.disabled = true;
            }
        }

        pwInput.addEventListener('input', function() {
            const val = this.value;
            updateReq('req-length', val.length >= 8);
            updateReq('req-upper', /[A-Z]/.test(val));
            updateReq('req-lower', /[a-z]/.test(val));
            updateReq('req-number', /\d/.test(val));
            validateMatch();
        });

        confirmInput.addEventListener('input', validateMatch);

        function validateMatch() {
            if (confirmInput.value.length === 0) {
                matchMsg.classList.add('hidden');
            } else if (pwInput.value === confirmInput.value) {
                matchMsg.classList.remove('hidden');
                matchMsg.innerText = "Passwords match!";
                matchMsg.className = "text-[10px] font-bold mt-1 pl-1 text-emerald-600 dark:text-emerald-400";
            } else {
                matchMsg.classList.remove('hidden');
                matchMsg.innerText = "Passwords do not match.";
                matchMsg.className = "text-[10px] font-bold mt-1 pl-1 text-red-500 dark:text-red-400";
            }
            checkFormValidity();
        }

        // Initialize button state
        checkFormValidity();

        // --- SUBMISSION LOGIC ---
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (pwInput.value !== confirmInput.value) {
                return alert("Passwords do not match!");
            }

            const origText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Processing...`;
            btnSubmit.disabled = true;

            const payload = {
                username: document.getElementById('regUsername').value,
                firstName: document.getElementById('regFirst').value,
                lastName: document.getElementById('regLast').value,
                email: document.getElementById('regEmail').value,
                password: pwInput.value,
                role: 'driver', 
                department: ['Pending Assignment'] 
            };

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert('Registration Successful! Please check your email to verify your account before logging in.');
                    window.location.href = 'login.html';
                } else {
                    alert(data.message || 'Registration failed.');
                    btnSubmit.innerHTML = origText;
                    checkFormValidity(); // Re-evaluate button state
                }
            } catch (err) {
                alert('Network error connecting to the server.');
                btnSubmit.innerHTML = origText;
                checkFormValidity();
            }
        });
    </script>
</body>
</html>
