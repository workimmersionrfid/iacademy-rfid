<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Registration - iACADEMY RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script>
        // 1. Tell Tailwind to use 'class' for dark mode
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { blue: '#1e3a8a', blueHover: '#1e40af', bg: '#f8fafc', border: '#e2e8f0' } }
                }
            }
        }

        // 2. Check local storage for theme preference BEFORE the page renders
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // Theme Toggle Function for standalone pages
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300 font-sans min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

    <button onclick="toggleTheme()" class="absolute top-6 right-6 z-20 w-10 h-10 flex items-center justify-center rounded-full bg-white/40 hover:bg-white/80 dark:bg-gray-800 dark:hover:bg-gray-700 text-blue-900 dark:text-gray-400 dark:hover:text-yellow-400 text-xl transition-all shadow-sm backdrop-blur-sm">
        <i class="fa-solid fa-moon dark:hidden"></i>
        <i class="fa-solid fa-sun hidden dark:inline"></i>
    </button>

    <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 dark:from-gray-800 dark:via-blue-900 dark:to-gray-900 z-0 transition-colors duration-300"></div>

    <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700 relative z-10 transition-colors duration-300">
        <div class="p-8 text-center bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 transition-colors">
            <i class="fa-solid fa-address-card text-blue-800 dark:text-blue-400 text-5xl mb-4 transition-colors"></i>
            <h1 class="text-2xl font-black text-gray-800 dark:text-white tracking-tight transition-colors">Driver Registration</h1>
            <p class="text-gray-500 dark:text-gray-400 text-xs font-bold uppercase tracking-widest mt-2 transition-colors">iACADEMY Fleet Management</p>
        </div>

        <form id="signupForm" class="p-8 space-y-4">
    <div>
        <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5 transition-colors">Username</label>
        <div class="relative">
            <i class="fa-solid fa-user-tag absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 transition-colors"></i>
            <input type="text" id="username" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl pl-11 p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 dark:focus:ring-blue-400 transition-all text-blue-900 dark:text-white">
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5 transition-colors">First Name</label>
            <input type="text" id="firstName" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 dark:focus:ring-blue-400 transition-all text-blue-900 dark:text-white">
        </div>
        <div>
            <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5 transition-colors">Last Name</label>
            <input type="text" id="lastName" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 dark:focus:ring-blue-400 transition-all text-blue-900 dark:text-white">
        </div>
    </div>

    <div>
        <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5 transition-colors">Middle Name (Optional)</label>
        <input type="text" id="middleName" class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 dark:focus:ring-blue-400 transition-all text-blue-900 dark:text-white">
    </div>

    <div>
        <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5 transition-colors">Email Address</label>
        <div class="relative">
            <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 transition-colors"></i>
            <input type="email" id="email" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl pl-11 p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 dark:focus:ring-blue-400 transition-all text-blue-900 dark:text-white">
        </div>
    </div>

    <div>
        <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5 transition-colors">Password</label>
        <div class="relative">
            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 transition-colors"></i>
            <input type="password" id="password" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 rounded-xl pl-11 pr-11 p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 dark:focus:ring-blue-400 transition-all text-blue-900 dark:text-white">
            <button type="button" onclick="togglePassword('password', 'toggleIcon')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">
                <i id="toggleIcon" class="fa-solid fa-eye"></i>
            </button>
        </div>
    </div>

    <button type="submit" class="w-full bg-blue-800 dark:bg-blue-600 hover:bg-blue-900 dark:hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition-colors mt-2 text-sm uppercase tracking-wider">
        Create Driver Account
    </button>
</form>
    </div>

    <script>
        // Function to toggle password visibility
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // 1. Capture all form values
            const username = document.getElementById('username').value;
        if (/\s/.test(username)) {
        alert("Username cannot contain spaces. Please use letters, numbers, underscores (_), or dots (.).");
        return;
    }
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const middleName = document.getElementById('middleName').value; // Optional
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // 2. Standard Password Validation Check
            const passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (!passRegex.test(password)) {
                alert("Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, and one number.");
                return;
            }
            
            // 3. Setup Default Driver metadata
            const role = 'driver'; 
            const department = ['Pending Assignment'];

            const submitBtn = document.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerText;
            
            // UI Feedback
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Registering...`;
            submitBtn.disabled = true;

            try {
                // 4. Send updated payload to backend
                const response = await fetch('https://iacademy-rfid.onrender.com/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username, 
                        firstName, 
                        lastName, 
                        middleName: middleName || "", 
                        email, 
                        password, 
                        role, 
                        department 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Account created! A verification link has been sent to ' + email + '. Please verify your email before logging in.');
                    window.location.href = 'login.html';
                } else {
                    alert(data.message || 'Registration failed.');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Registration error:', error);
                alert('Server error. Please check your internet connection or ensure the backend is active.');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
