<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Itinerary & Map - iACADEMY RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        // 1. Tell Tailwind to use 'class' for dark mode
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { blue: '#1e3a8a', blueHover: '#1e40af', bg: '#f8fafc', border: '#e2e8f0' } }
                }
            }
        }

        // 2. Check local storage for theme preference BEFORE the page renders
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-brand-bg dark:bg-gray-900 text-slate-800 dark:text-gray-200 font-sans antialiased min-h-screen flex flex-col transition-colors duration-300">
    
    <div id="shared-nav" class="shrink-0"></div>
    
    <main class="flex-1 max-w-[1400px] w-full mx-auto px-6 py-8 flex flex-col h-auto space-y-8">
        
        <div class="bg-gradient-to-r from-blue-800 via-blue-400 to-blue-50 dark:from-gray-800 dark:via-blue-900 dark:to-gray-900 rounded-2xl shadow-md p-8 md:p-12 relative overflow-hidden flex items-center justify-between transition-colors duration-300 shrink-0">
            <div class="relative z-10">
                <p class="text-blue-100 text-sm font-medium mb-1 tracking-wide uppercase">GPS & Routing</p>
                <h1 class="text-3xl md:text-4xl font-bold text-white tracking-tight">Itinerary & Map</h1>
                <p class="text-blue-50 mt-2 max-w-lg text-sm">Monitor live fleet locations and track daily route progression.</p>
            </div>
            <div class="hidden md:block relative z-10 text-white/20">
                <i class="fa-solid fa-map-location-dot text-9xl"></i>
            </div>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-md border border-blue-50 dark:border-gray-700 p-6 flex flex-col md:flex-row gap-4 transition-colors duration-300 shrink-0">
            
            <div id="adminDriverSelectWrapper" class="hidden w-full md:w-1/4">
                <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Filter by Driver</label>
                <select id="driverSelect" onchange="loadDriverItinerary()" class="w-full border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 dark:focus:border-blue-400 bg-white dark:bg-gray-900 text-gray-800 dark:text-white transition-colors cursor-pointer font-medium">
                    <option value="">Select driver...</option>
                </select>
            </div>

            <div class="w-full md:w-1/4">
                <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1.5">Date</label>
                <input type="date" id="itineraryDate" onchange="loadDriverItinerary()" class="w-full border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 dark:focus:border-blue-400 bg-white dark:bg-gray-900 text-gray-800 dark:text-white transition-colors cursor-pointer font-medium">
            </div>

        </div>

        <div class="flex-1 flex flex-col lg:flex-row gap-6 min-h-0">
            
            <div class="w-full lg:w-1/3 bg-white dark:bg-gray-800 rounded-2xl shadow-md border border-blue-50 dark:border-gray-700 overflow-hidden flex flex-col relative shrink-0 transition-colors duration-300">
                <div class="absolute top-0 left-0 w-1 h-full bg-blue-600 dark:bg-blue-500"></div>
                <div class="p-5 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-gray-50/50 dark:bg-gray-900/50 shrink-0 transition-colors">
                    <h2 class="font-bold text-lg text-blue-900 dark:text-white">Task Route</h2>
                    <span id="dateDisplay" class="text-[10px] font-bold text-blue-600 dark:text-blue-400 bg-blue-100 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 px-2 py-1 rounded uppercase tracking-widest">Date</span>
                </div>
                
                <div class="flex-1 overflow-y-auto custom-scrollbar p-5">
                    
                    <div id="driverStatusHeader" class="mb-5 p-4 bg-blue-50 dark:bg-blue-900/20 rounded-xl border border-blue-100 dark:border-blue-800 hidden transition-colors">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-blue-600 dark:bg-blue-500 text-white rounded-full flex items-center justify-center font-bold shadow-md">
                                <i class="fa-solid fa-user-astronaut"></i>
                            </div>
                            <div>
                                <h3 id="displayDriverName" class="font-black text-blue-900 dark:text-white uppercase tracking-wide">Driver</h3>
                                <p id="displayVehicle" class="text-xs font-bold text-blue-600 dark:text-blue-400 tracking-wider">Vehicle</p>
                            </div>
                        </div>
                        <div class="mt-3 pt-3 border-t border-blue-200/50 dark:border-blue-800/50 flex items-center gap-2">
                            <span id="pulseWrapper" class="relative flex h-3 w-3">
                                <span id="pulseIndicator" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                            </span>
                            <p id="displayLastUpdate" class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest">Awaiting GPS Lock...</p>
                        </div>
                    </div>

                    <div class="relative border-l-2 border-gray-100 dark:border-gray-700 ml-4 space-y-8 pb-4 transition-colors" id="itineraryTimeline">
                        <div class="text-center p-8 text-blue-400 dark:text-blue-500 text-sm font-medium -ml-4"><i class="fa-solid fa-spinner fa-spin mb-3 text-2xl"></i><br>Loading Itinerary...</div>
                    </div>
                </div>
            </div>

            <div class="w-full lg:w-2/3 bg-white dark:bg-gray-800 rounded-2xl shadow-md border border-blue-50 dark:border-gray-700 overflow-hidden relative h-[500px] lg:h-auto lg:min-h-[600px] shrink-0 mt-6 lg:mt-0 transition-colors duration-300">
                <div id="map" class="absolute inset-0 w-full h-full z-10"></div>

                <div class="absolute top-4 right-4 bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm p-4 rounded-xl shadow-lg border border-gray-100 dark:border-gray-700 z-20 w-64 transition-colors">
                    <h4 class="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-3 border-b border-gray-100 dark:border-gray-700 pb-2">Tracking Status</h4>
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-blue-600 dark:text-blue-400"><i class="fa-solid fa-truck"></i></div>
                        <div>
                            <p class="text-xs font-bold text-gray-800 dark:text-gray-200" id="mapStatusText">Connecting...</p>
                            <p class="text-[10px] text-gray-500 dark:text-gray-400" id="mapActionText">Fetching route data</p>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const API_BASE = 'https://iacademy-rfid.onrender.com/api';
        
        let map;
        let directionsService;
        let directionsRenderer;
        let driverMarker = null;

        const userRole = localStorage.getItem('userRole');
        const currentUser = localStorage.getItem('username');

        // 1. Instant Load Map
        function loadGoogleMaps() {
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyAeJ7SLq9sJ1ZYhTaWAnsOB260RJLxK8Jw&callback=initTrackingMap`;
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        }

        window.initTrackingMap = function() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 14.5632, lng: 121.0142 }, 
                zoom: 14,
                disableDefaultUI: false,
                mapTypeControl: false,
                streetViewControl: false
            });
            
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                suppressMarkers: true, 
                polylineOptions: { strokeColor: '#2563eb', strokeWeight: 6, strokeOpacity: 0.8 }
            });

            initializeApp();
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof renderNavigation === 'function') renderNavigation('travel-map');
            loadGoogleMaps();
        });

        async function initializeApp() {
            const dateInput = document.getElementById('itineraryDate');
            dateInput.valueAsDate = new Date();

            if (userRole === 'admin') {
                document.getElementById('adminDriverSelectWrapper').classList.remove('hidden');
                try {
                    const res = await fetch(`${API_BASE}/drivers`);
                    const drivers = await res.json();
                    const select = document.getElementById('driverSelect');
                    drivers.forEach(d => {
                        select.innerHTML += `<option value="${d.username}">${d.username}</option>`;
                    });
                } catch (err) { console.error("Could not load drivers."); }
                
                document.getElementById('itineraryTimeline').innerHTML = `<div class="text-center p-8 text-gray-400 dark:text-gray-500 text-sm font-medium -ml-4">Select a driver from the top menu to view their itinerary.</div>`;
            } else {
                loadDriverItinerary();
            }
        }

        async function loadDriverItinerary() {
            let targetDriver = currentUser;
            if (userRole === 'admin') {
                targetDriver = document.getElementById('driverSelect').value;
            }
            
            const targetDate = document.getElementById('itineraryDate').value;
            
            if (!targetDriver || !targetDate) return;

            const dateObj = new Date(targetDate);
            document.getElementById('dateDisplay').innerText = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            document.getElementById('itineraryTimeline').innerHTML = `<div class="text-center p-8 text-blue-400 dark:text-blue-500 text-sm font-medium -ml-4"><i class="fa-solid fa-spinner fa-spin mb-3 text-2xl"></i><br>Fetching Route Data...</div>`;

            try {
                const [tasksRes, logsRes] = await Promise.all([
                    fetch(`${API_BASE}/tasks`),
                    fetch(`${API_BASE}/action-logs`)
                ]);
                
                const allTasks = await tasksRes.json();
                const allLogs = await logsRes.json();

                const selectedTasks = allTasks.filter(t => t.driver === targetDriver && t.date === targetDate);
                
                const dateLogs = allLogs.filter(l => 
                    l.driver_name === targetDriver && 
                    l.latitude && l.latitude !== "N/A" &&
                    new Date(l.timestamp).toISOString().startsWith(targetDate)
                );
                
                const latestLog = dateLogs.length > 0 ? dateLogs[0] : null;

                renderItineraryUI(targetDriver, selectedTasks, latestLog, targetDate);
                updateLiveMap(selectedTasks, latestLog, targetDate);

            } catch (err) {
                console.error(err);
                document.getElementById('itineraryTimeline').innerHTML = `<div class="text-center p-8 text-red-500 dark:text-red-400 text-sm font-bold -ml-4">Error loading itinerary data.</div>`;
            }
        }

        function renderItineraryUI(driverName, tasks, latestLog, targetDate) {
            const header = document.getElementById('driverStatusHeader');
            header.classList.remove('hidden');
            document.getElementById('displayDriverName').innerText = driverName;
            
            if (tasks.length > 0) {
                document.getElementById('displayVehicle').innerText = `Vehicle: ${tasks[0].vehicle}`;
            } else {
                document.getElementById('displayVehicle').innerText = `No vehicle assigned for this date`;
            }

            const lastUpdateText = document.getElementById('displayLastUpdate');
            const pulseWrap = document.getElementById('pulseWrapper');
            const pulse = document.getElementById('pulseIndicator');
            
            const isToday = (targetDate === new Date().toISOString().split('T')[0]);

            if (latestLog) {
                const logTime = new Date(latestLog.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                lastUpdateText.innerText = `Last GPS Ping: ${logTime} (${latestLog.action})`;
                lastUpdateText.classList.replace('text-gray-500', 'text-emerald-700'); lastUpdateText.classList.replace('dark:text-gray-400', 'dark:text-emerald-400');
                pulseWrap.classList.remove('hidden');
                pulse.classList.replace('bg-gray-400', 'bg-emerald-400');
                pulse.nextElementSibling.classList.replace('bg-gray-500', 'bg-emerald-500');
                
                document.getElementById('mapStatusText').innerText = isToday ? "Live Tracking Active" : "Historical GPS Data";
                document.getElementById('mapActionText').innerText = `${latestLog.action} at ${logTime}`;
                
                if (!isToday) pulse.classList.remove('animate-ping');
                else pulse.classList.add('animate-ping');

            } else {
                lastUpdateText.innerText = `No GPS Data for this date`;
                lastUpdateText.classList.replace('text-emerald-700', 'text-gray-500'); lastUpdateText.classList.replace('dark:text-emerald-400', 'dark:text-gray-400');
                pulseWrap.classList.add('hidden');
                
                document.getElementById('mapStatusText').innerText = "No GPS Signal";
                document.getElementById('mapActionText').innerText = "Awaiting driver updates";
            }

            const timeline = document.getElementById('itineraryTimeline');
            
            if (tasks.length === 0) {
                timeline.innerHTML = `<div class="text-center p-8 text-gray-400 dark:text-gray-500 text-sm font-medium -ml-4">No tasks found for this date.</div>`;
                return;
            }

            let html = '';
            
            html += `
                <div class="relative pl-6">
                    <div class="absolute -left-[9px] top-1 w-4 h-4 bg-gray-200 dark:bg-gray-600 border-2 border-white dark:border-gray-900 rounded-full z-10"></div>
                    <div class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-xl border border-gray-100 dark:border-gray-700 opacity-60">
                        <span class="text-[9px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest">Origin / Start</span>
                        <h4 class="font-bold text-gray-700 dark:text-gray-300 mt-0.5">iACADEMY Nexus</h4>
                    </div>
                </div>
            `;

            tasks.forEach((t, index) => {
                const isCompleted = (t.status === 'Completed' || t.status === 'Rebook');
                const isNext = (!isCompleted && (index === 0 || (tasks[index-1].status === 'Completed' || tasks[index-1].status === 'Rebook')));
                
                let dotColor = 'bg-gray-300 dark:bg-gray-600';
                let boxClass = 'bg-white dark:bg-gray-800 opacity-50 border-gray-100 dark:border-gray-700';
                let titleColor = 'text-gray-500 dark:text-gray-400';
                let icon = '';

                if (isCompleted) {
                    dotColor = t.status === 'Rebook' ? 'bg-orange-400' : 'bg-emerald-500';
                    boxClass = 'bg-gray-50 dark:bg-gray-800/50 border-gray-100 dark:border-gray-700';
                    titleColor = 'text-gray-400 dark:text-gray-500 line-through';
                    icon = t.status === 'Rebook' ? '<i class="fa-solid fa-rotate-right text-orange-500 float-right"></i>' : '<i class="fa-solid fa-check text-emerald-500 float-right"></i>';
                } else if (isNext && isToday) {
                    dotColor = 'bg-blue-600 dark:bg-blue-500 ring-4 ring-blue-100 dark:ring-blue-900/30';
                    boxClass = 'bg-blue-50 dark:bg-blue-900/20 border-blue-200 dark:border-blue-800 shadow-sm';
                    titleColor = 'text-blue-900 dark:text-white';
                    icon = '<i class="fa-solid fa-location-crosshairs text-blue-500 float-right animate-pulse"></i>';
                } else {
                    boxClass = 'bg-white dark:bg-gray-800 border-gray-100 dark:border-gray-700';
                    titleColor = 'text-gray-800 dark:text-gray-200';
                }

                html += `
                    <div class="relative pl-6 mt-6">
                        <div class="absolute -left-[9px] top-4 w-4 h-4 ${dotColor} border-2 border-white dark:border-gray-900 rounded-full z-10 transition-all"></div>
                        <div class="p-4 rounded-xl border transition-all ${boxClass}">
                            ${icon}
                            <span class="text-[9px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest">${t.taskType || 'Stop ' + (index + 1)}</span>
                            <h4 class="font-bold text-base mt-0.5 ${titleColor}">${t.destination}</h4>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 line-clamp-1" title="${t.description}">${t.description}</p>
                            ${(isNext && isToday) ? `<div class="mt-3 inline-block bg-blue-600 text-white text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">Next Destination</div>` : ''}
                        </div>
                    </div>
                `;
            });

            timeline.innerHTML = html;
        }

        function updateLiveMap(tasks, latestLog, targetDate) {
            if (!map || !directionsService) return;

            directionsRenderer.setDirections({routes: []});

            const pendingTasks = tasks.filter(t => t.status !== 'Completed' && t.status !== 'Rebook');
            let currentLocation = { lat: 14.5632, lng: 121.0142 }; 

            if (latestLog && latestLog.latitude) {
                currentLocation = { lat: parseFloat(latestLog.latitude), lng: parseFloat(latestLog.longitude) };
                
                const carIcon = {
                    path: 'M17.402,0H5.643C2.526,0,0,3.467,0,6.584v34.804c0,3.116,2.526,5.644,5.643,5.644h11.759c3.116,0,5.644-2.527,5.644-5.644 V6.584C23.044,3.467,20.518,0,17.402,0z M22.057,14.188v11.665l-2.729,0.351v-4.806L22.057,14.188z M20.625,10.773 c-1.016,3.9-2.219,8.51-2.219,8.51H4.638l-2.222-8.51C2.417,10.773,11.3,7.755,20.625,10.773z M3.748,21.713v4.492l-2.73-0.349 V14.502L3.748,21.713z M1.018,37.938V27.579l2.73,0.343v8.196L1.018,37.938z M2.575,40.882l2.218-3.336h13.771l2.219,3.336H2.575z M19.328,35.805v-7.872l2.729-0.355v10.048L19.328,35.805z',
                    fillColor: (targetDate === new Date().toISOString().split('T')[0]) ? '#2563eb' : '#6b7280', 
                    fillOpacity: 1,
                    strokeWeight: 0,
                    scale: 0.6,
                    anchor: new google.maps.Point(11.5, 23.5)
                };

                if (!driverMarker) {
                    driverMarker = new google.maps.Marker({ position: currentLocation, map: map, icon: carIcon, title: 'Driver Location' });
                } else {
                    driverMarker.setIcon(carIcon);
                    driverMarker.setPosition(currentLocation);
                }
                
                map.setCenter(currentLocation);
            }

            if (pendingTasks.length > 0) {
                const finalDestination = pendingTasks[pendingTasks.length - 1].destination;
                const waypoints = pendingTasks.slice(0, -1).map(t => ({ location: t.destination, stopover: true }));

                directionsService.route({
                    origin: currentLocation,
                    destination: finalDestination,
                    waypoints: waypoints,
                    optimizeWaypoints: false,
                    travelMode: google.maps.TravelMode.DRIVING
                }, (response, status) => {
                    if (status === 'OK') {
                        directionsRenderer.setDirections(response);
                        const legs = response.routes[0].legs;
                        legs.forEach((leg, idx) => {
                            new google.maps.Marker({
                                position: leg.end_location,
                                map: map,
                                label: { text: `${idx + 1}`, color: "white", fontWeight: "bold" },
                                title: leg.end_address
                            });
                        });
                    }
                });
            } else if (tasks.length > 0 && pendingTasks.length === 0) {
                document.getElementById('mapStatusText').innerText = "Route Completed";
                document.getElementById('mapActionText').innerText = "All stops finished";
                if(driverMarker) map.setZoom(16);
            }
        }
    </script>
</body>
</html>
