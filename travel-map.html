<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fleet Map - iACADEMY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { blue: '#1e3a8a', bg: '#f8fafc' } }
                }
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem('token');
            if (!token) window.location.href = 'login.html';
        });
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .pac-container { z-index: 99999 !important; border-radius: 0.75rem; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-brand-bg text-slate-800 font-sans antialiased min-h-screen flex flex-col">
    
    <div id="shared-nav"></div>
    
    <main class="flex-1 max-w-[1400px] w-full mx-auto px-4 md:px-6 py-6 md:py-8 space-y-6">
        
        <div class="bg-gradient-to-r from-blue-800 via-blue-400 to-blue-50 rounded-2xl shadow-md p-6 md:p-10 relative overflow-hidden flex items-center justify-between">
            <div class="relative z-10">
                <p id="role-subtitle" class="text-blue-100 text-xs font-bold mb-1 tracking-widest uppercase">System Loading...</p>
                <h1 id="role-title" class="text-2xl md:text-4xl font-bold text-white tracking-tight">Fleet Intelligence</h1>
            </div>
            <div class="hidden md:block relative z-10 text-white/20">
                <i id="header-icon" class="fa-solid fa-satellite text-7xl md:text-9xl"></i>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 h-full">
            
            <div class="lg:col-span-4 flex flex-col h-full order-2 lg:order-1 space-y-6">
                
                <div id="admin-fleet-panel" class="hidden bg-white rounded-2xl shadow-md border border-blue-50 flex flex-col h-[600px]">
                    <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 rounded-t-2xl">
                        <h2 class="font-bold text-blue-900">Live Driver Status</h2>
                        <span id="active-count" class="bg-blue-100 text-blue-700 text-[10px] font-black px-2 py-1 rounded">0 ACTIVE</span>
                    </div>
                    <div id="fleet-list" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                        <p class="text-center text-gray-400 text-sm py-10">Loading fleet coordinates...</p>
                    </div>
                </div>

                <div id="driver-itinerary-panel" class="hidden bg-white rounded-2xl shadow-md border border-blue-50 flex flex-col h-[600px]">
                    <div class="p-6 border-b border-gray-100 bg-gray-50/50 rounded-t-2xl">
                        <h2 class="font-bold text-blue-900">My Assigned Itinerary</h2>
                        <p class="text-[10px] text-gray-400 font-bold uppercase mt-1">Select a task to generate route</p>
                    </div>
                    <div id="itinerary-list" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                        <p class="text-center text-gray-400 text-sm py-10">Fetching your tasks...</p>
                    </div>
                </div>

                <div id="route-summary-panel" class="hidden bg-blue-900 rounded-2xl shadow-lg p-6 text-white animate-[fadeIn_0.3s]">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-sm font-bold uppercase tracking-widest text-blue-200">Trip Estimate</h3>
                        <button onclick="closeSummary()" class="text-blue-300 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="space-y-4">
                        <div class="flex justify-between border-b border-blue-800 pb-2">
                            <span class="text-xs text-blue-300">Distance / Time</span>
                            <span id="res-dist-time" class="font-bold text-sm">--</span>
                        </div>
                        <div class="flex justify-between border-b border-blue-800 pb-2">
                            <span class="text-xs text-blue-300">Est. Fuel Consumption</span>
                            <span id="res-fuel" class="font-bold text-sm text-emerald-400">--</span>
                        </div>
                        <div class="pt-2 text-center">
                            <p class="text-[10px] text-blue-400 uppercase font-bold mb-1">Total Trip Budget</p>
                            <h3 id="res-total-cost" class="text-3xl font-black">₱0.00</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 bg-white rounded-2xl shadow-md border border-blue-50 overflow-hidden relative min-h-[500px] lg:h-[600px] order-1 lg:order-2">
                <div id="map" class="absolute inset-0 w-full h-full z-10"></div>
                
                <div id="gps-status" class="hidden absolute top-4 left-4 z-20 bg-white/90 backdrop-blur px-3 py-2 rounded-full shadow-md border border-gray-100 flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span class="text-[10px] font-bold text-gray-600 uppercase tracking-widest">GPS Active</span>
                </div>
            </div>
            
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        let map, directionsService, directionsRenderer, trafficLayer;
        let markers = [];
        const role = localStorage.getItem('userRole');
        const username = localStorage.getItem('username');
        const API_BASE = 'https://iacademy-rfid.onrender.com/api';

        document.addEventListener("DOMContentLoaded", () => {
            renderNavigation('travel-map');
            setupRoleUI();
            loadGoogleMaps();
        });

        function setupRoleUI() {
            const sub = document.getElementById('role-subtitle');
            const title = document.getElementById('role-title');
            const icon = document.getElementById('header-icon');

            if (role === 'admin') {
                sub.innerText = "Command Center";
                title.innerText = "Live Fleet Tracker";
                icon.className = "fa-solid fa-tower-broadcast text-9xl";
                document.getElementById('admin-fleet-panel').classList.remove('hidden');
                startAdminPolling();
            } else {
                sub.innerText = "Navigation Hub";
                title.innerText = "My Route Navigator";
                icon.className = "fa-solid fa-location-arrow text-9xl";
                document.getElementById('driver-itinerary-panel').classList.remove('hidden');
                document.getElementById('gps-status').classList.remove('hidden');
                loadDriverItinerary();
            }
        }

        // --- MAP INITIALIZATION ---
        function loadGoogleMaps() {
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyAeJ7SLq9sJ1ZYhTaWAnsOB260RJLxK8Jw&libraries=places&callback=initMapLogic`;
            script.async = true;
            document.head.appendChild(script);
        }

        window.initMapLogic = function() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 14.5632, lng: 121.0142 }, 
                zoom: 13,
                styles: [{ featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] }]
            });
            
            trafficLayer = new google.maps.TrafficLayer();
            trafficLayer.setMap(map);

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                polylineOptions: { strokeColor: '#3674FF', strokeWeight: 6 }
            });
        }

        // --- DRIVER LOGIC: Itinerary & Routing ---
        async function loadDriverItinerary() {
            const list = document.getElementById('itinerary-list');
            try {
                const res = await fetch(`${API_BASE}/tasks`);
                const allTasks = await res.json();
                const myTasks = allTasks.filter(t => t.driver === username && t.status === 'Pending');

                if (myTasks.length === 0) {
                    list.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">No pending tasks for today.</div>`;
                    return;
                }

                list.innerHTML = myTasks.map(t => `
                    <div class="bg-blue-50/50 border border-blue-100 p-4 rounded-xl hover:border-blue-300 transition-all cursor-pointer group" onclick="autoRouteTo('${t.destination}', '${t.vehicle}')">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[9px] font-black bg-blue-100 text-blue-700 px-2 py-0.5 rounded tracking-widest uppercase">${t.vehicle}</span>
                            <i class="fa-solid fa-chevron-right text-blue-200 group-hover:text-blue-500 transition-colors"></i>
                        </div>
                        <h3 class="font-bold text-blue-900 text-sm">${t.destination}</h3>
                        <p class="text-[11px] text-gray-500 mt-1 line-clamp-1">${t.description}</p>
                        <button class="mt-4 w-full bg-blue-600 text-white text-[10px] font-bold py-2 rounded-lg shadow-sm uppercase tracking-widest">Start Navigation</button>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        async function autoRouteTo(destination, plate) {
            if (!navigator.geolocation) return alert("Please enable GPS to use navigation.");
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const origin = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                
                // Get Vehicle Efficiency for Calculator
                const fleet = await getVehicles();
                const v = fleet.find(car => car.plateNumber === plate) || { efficiency: 14 };

                directionsService.route({
                    origin: origin,
                    destination: destination,
                    travelMode: 'DRIVING'
                }, (response, status) => {
                    if (status === 'OK') {
                        directionsRenderer.setDirections(response);
                        const route = response.routes[0].legs[0];
                        
                        // Calculate Budget info
                        const distKm = route.distance.value / 1000;
                        const liters = distKm / v.efficiency;
                        const fuelCost = liters * 75; // Baseline PH price

                        document.getElementById('res-dist-time').innerText = `${route.distance.text} / ${route.duration.text}`;
                        document.getElementById('res-fuel').innerText = `${liters.toFixed(2)}L Needed`;
                        document.getElementById('res-total-cost').innerText = `₱${fuelCost.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                        document.getElementById('route-summary-panel').classList.remove('hidden');
                        
                        if(window.innerWidth < 1024) document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });
        }

        // --- ADMIN LOGIC: Live Fleet Tracking ---
        async function startAdminPolling() {
            updateFleetMap();
            setInterval(updateFleetMap, 15000); // Update every 15 seconds
        }

        async function updateFleetMap() {
            try {
                const res = await fetch(`${API_BASE}/action-logs`);
                const logs = await res.json();
                
                // Get only the latest entry for each driver
                const latestLogs = {};
                logs.forEach(log => {
                    if (!latestLogs[log.driver_name]) latestLogs[log.driver_name] = log;
                });

                const activeDrivers = Object.values(latestLogs);
                document.getElementById('active-count').innerText = `${activeDrivers.length} ACTIVE`;

                // Update Sidebar List
                const list = document.getElementById('fleet-list');
                list.innerHTML = activeDrivers.map(log => {
                    const isOld = (new Date() - new Date(log.timestamp)) > 3600000; // Over 1 hour old
                    const statusColor = isOld ? 'text-gray-400' : 'text-emerald-500';
                    return `
                    <div class="bg-white border border-gray-100 p-4 rounded-xl shadow-sm hover:shadow-md transition-all cursor-pointer" onclick="focusOnDriver('${log.latitude}', '${log.longitude}')">
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-sm text-gray-800">${log.driver_name}</h4>
                            <span class="text-[9px] font-bold text-gray-400">${new Date(log.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-[10px] font-black text-blue-600 uppercase tracking-tighter">${log.plate_number}</span>
                            <span class="text-[10px] font-medium text-gray-400">•</span>
                            <span class="text-[10px] ${statusColor} font-bold uppercase">${log.action}</span>
                        </div>
                        <p class="text-[11px] text-gray-500 mt-2 italic truncate"><i class="fa-solid fa-location-dot mr-1"></i> ${log.location}</p>
                    </div>
                `}).join('');

                // Update Map Markers
                markers.forEach(m => m.setMap(null));
                markers = [];

                activeDrivers.forEach(log => {
                    if (log.latitude === "N/A") return;
                    const marker = new google.maps.Marker({
                        position: { lat: parseFloat(log.latitude), lng: parseFloat(log.longitude) },
                        map: map,
                        title: log.driver_name,
                        icon: {
                            path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                            scale: 5,
                            fillColor: "#3674FF",
                            fillOpacity: 1,
                            strokeWeight: 2,
                            strokeColor: "#FFFFFF"
                        }
                    });

                    const info = new google.maps.InfoWindow({
                        content: `<div class="p-2"><b class="text-blue-600">${log.driver_name}</b><br><span class="text-xs text-gray-500">${log.action}</span></div>`
                    });
                    marker.addListener("click", () => info.open(map, marker));
                    markers.push(marker);
                });

            } catch (e) { console.error("Fleet fetch error:", e); }
        }

        window.focusOnDriver = function(lat, lng) {
            if (lat === "N/A") return alert("No GPS coordinates available for this record.");
            map.setCenter({ lat: parseFloat(lat), lng: parseFloat(lng) });
            map.setZoom(16);
        };

        window.closeSummary = () => document.getElementById('route-summary-panel').classList.add('hidden');

    </script>
</body>
</html>
