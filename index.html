<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - iACADEMY RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { blue: '#1e3a8a', bg: '#f8fafc' } }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg font-sans min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    
    <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-r from-blue-800 via-blue-400 to-blue-50 z-0"></div>

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100 relative z-10">
        <div class="p-8 text-center bg-white border-b border-gray-100">
            <i class="fa-solid fa-building-shield text-blue-800 text-5xl mb-4"></i>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">iACADEMY <span class="text-blue-800 font-light">RFID</span></h1>
            <p class="text-gray-500 text-xs font-bold uppercase tracking-widest mt-2">Vehicle Management System</p>
        </div>

        <form id="loginForm" class="p-8 space-y-6">
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="username" required class="w-full border border-gray-200 bg-gray-50 rounded-xl pl-11 p-3.5 text-sm font-medium outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:bg-white transition-all text-blue-900">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="password" required class="w-full border border-gray-200 bg-gray-50 rounded-xl pl-11 pr-11 p-3.5 text-sm font-medium outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:bg-white transition-all text-blue-900">
                    <button type="button" onclick="togglePassword('password', 'loginToggleIcon')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
                        <i id="loginToggleIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <a href="forgot-password.html" class="text-xs font-bold text-blue-600 hover:text-blue-800 transition-colors">Forgot password?</a>
            </div>

            <button type="submit" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-4 rounded-xl shadow-md transition-colors mt-2 text-sm uppercase tracking-wider">
                Sign In to Portal
            </button>
            
            <p class="text-center text-xs text-gray-500 mt-6 font-medium">
                Don't have a driver account? <a href="signup.html" class="text-blue-700 font-bold hover:underline">Register Here</a>
            </p>
        </form>
    </div>

    <script>
        // Check the URL for the verification success flag and display a banner if present
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('verified') === 'success') {
            const formContainer = document.getElementById('loginForm');
            const successBanner = document.createElement('div');
            successBanner.className = "bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold p-3 rounded-xl mb-6 text-center";
            successBanner.innerHTML = "<i class='fa-solid fa-check-circle mr-1'></i> Email successfully verified! You may now log in.";
            formContainer.prepend(successBanner);
        }

        // Function to toggle password visibility
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        const savedToken = localStorage.getItem('token');
        const savedRole = localStorage.getItem('userRole');

        if (savedToken && savedRole) {
            if (savedRole === 'admin') window.location.href = 'dashboard.html';
            else window.location.href = 'driver-dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.querySelector('button[type="submit"]');
            
            const originalText = submitBtn.innerText;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Authenticating...`;
            submitBtn.disabled = true;

            try {
                const response = await fetch('https://iacademy-rfid.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

              if (response.ok) {
                    // Check if email verification is flagged by the backend
                    if (data.isVerified === false) {
                        alert("Please verify your email address before logging in.");
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                        return;
                    }

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('username', username);
                    if (data.department) localStorage.setItem('userDept', data.department);

                    if (data.role === 'admin') window.location.href = 'dashboard.html';
                    else window.location.href = 'driver-dashboard.html';
                } else {
                    alert(data.message || 'Login failed. Please check your credentials.');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Server error. Make sure your backend is running!');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('PWA Ready!');
                }).catch(error => {
                    console.log('PWA Failed: ', error);
                });
            });
        }
    </script>
</body>
</html>
