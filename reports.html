<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics - iACADEMY RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />

    <style>
        .daterangepicker .ranges li.active { background-color: #1e3a8a !important; }
        .daterangepicker td.active, .daterangepicker td.active:hover { background-color: #1e3a8a !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { blue: '#1e3a8a', bg: '#f8fafc' } }
                }
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem('token');
            const role = localStorage.getItem('userRole');
            if (!token || role !== 'admin') window.location.href = 'login.html';
        });
    </script>
</head>
<body class="bg-brand-bg font-sans min-h-screen text-gray-800 antialiased">

    <div id="shared-nav"></div>

    <main class="max-w-[1400px] mx-auto px-6 py-8 space-y-8">
        
        <div class="bg-gradient-to-r from-blue-800 via-blue-400 to-blue-50 rounded-2xl shadow-md p-8 md:p-12 relative overflow-hidden flex items-center justify-between">
            <div class="relative z-10">
                <p class="text-blue-100 text-sm font-medium mb-1 tracking-wide uppercase">Administrator Portal</p>
                <h1 class="text-3xl md:text-4xl font-bold text-white tracking-tight">Reports & Analytics</h1>
                <p class="text-blue-50 mt-2 max-w-lg text-sm">Filter, analyze, and export comprehensive action and handover logs.</p>
            </div>
            <div class="hidden md:block relative z-10 text-white/20">
                <i class="fa-solid fa-chart-pie text-9xl"></i>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden mb-6 relative">
            <div class="absolute top-6 bottom-6 left-0 w-1 bg-blue-600 rounded-r"></div>
            
            <div class="p-6">
                <h3 class="text-blue-900 font-bold text-lg mb-5 flex items-center gap-2 pl-3">
                    <i class="fa-solid fa-filter text-blue-500"></i> Database Filters
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 pl-3">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1 tracking-widest">Date Range</label>
                        <div class="relative">
                            <i class="fa-regular fa-calendar absolute left-3 top-1/2 -translate-y-1/2 text-blue-500 text-xs"></i>
                            <input type="text" id="reportDateRange" class="w-full bg-white border border-gray-200 text-blue-900 text-sm font-bold rounded-lg py-2.5 pl-9 pr-3 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all cursor-pointer shadow-sm" placeholder="All Time">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1 tracking-widest">Department</label>
                        <select id="reportDeptFilter" class="w-full bg-white border border-gray-200 text-blue-900 text-sm font-bold rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all cursor-pointer shadow-sm">
                            <option value="All">All Departments</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1 tracking-widest">Driver</label>
                        <select id="reportDriverFilter" class="w-full bg-white border border-gray-200 text-blue-900 text-sm font-bold rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all cursor-pointer shadow-sm">
                            <option value="All">All Drivers</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1 tracking-widest">Task Category</label>
                        <select id="reportTaskFilter" class="w-full bg-white border border-gray-200 text-blue-900 text-sm font-bold rounded-lg p-2.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all cursor-pointer shadow-sm">
                            <option value="All">All Tasks</option>
                            <option value="Asset Collection">Asset Collection</option>
                            <option value="Document Routing">Document Routing</option>
                            <option value="Hardware Transport">Hardware Transport</option>
                            <option value="Bank Transaction">Bank Transaction</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-col xl:flex-row justify-between items-start xl:items-end gap-4 border-t border-gray-100 pt-5 pl-3">
                    
                    <div class="flex flex-wrap gap-3">
                        <button id="btn-rep-completed" onclick="toggleReportStatus('Completed')" class="rep-status-btn flex flex-col items-center justify-center px-4 py-2 w-28 rounded-lg border border-emerald-200 bg-emerald-50 text-emerald-600 transition-all hover:bg-emerald-100 cursor-pointer">
                            <span class="text-[9px] font-bold uppercase tracking-widest mb-0.5">Completed</span>
                            <span class="text-xl font-black leading-none" id="repCountCompleted">0</span>
                        </button>
                        
                        <button id="btn-rep-failed" onclick="toggleReportStatus('Failed')" class="rep-status-btn flex flex-col items-center justify-center px-4 py-2 w-28 rounded-lg border border-red-100 bg-red-50 text-red-600 transition-all hover:bg-red-100 cursor-pointer">
                            <span class="text-[9px] font-bold uppercase tracking-widest mb-0.5">Failed</span>
                            <span class="text-xl font-black leading-none" id="repCountFailed">0</span>
                        </button>
                        
                        <button id="btn-rep-transit" onclick="toggleReportStatus('Transit')" class="rep-status-btn flex flex-col items-center justify-center px-4 py-2 w-32 rounded-lg border border-blue-100 bg-blue-50 text-blue-600 transition-all hover:bg-blue-100 cursor-pointer">
                            <span class="text-[9px] font-bold uppercase tracking-widest mb-0.5 whitespace-nowrap">Transit Updates</span>
                            <span class="text-xl font-black leading-none" id="repCountTransit">0</span>
                        </button>
                    </div>

                    <div class="flex flex-wrap gap-2">
                        <button onclick="clearReportFilters()" class="px-5 py-2.5 bg-gray-50 text-gray-700 font-bold text-sm rounded-lg border border-gray-200 hover:bg-gray-100 transition-colors shadow-sm">
                            <i class="fa-solid fa-eraser mr-1 opacity-70"></i> Clear
                        </button>
                        <button onclick="renderReportBoard()" class="px-6 py-2.5 bg-blue-700 text-white font-bold text-sm rounded-lg hover:bg-blue-800 transition-colors shadow-sm">
                            <i class="fa-solid fa-magnifying-glass mr-1 opacity-70"></i> Search Database
                        </button>
                        <button onclick="exportToExcel()" class="px-6 py-2.5 bg-emerald-600 text-white font-bold text-sm rounded-lg hover:bg-emerald-700 transition-colors shadow-sm">
                            <i class="fa-solid fa-file-excel mr-1 opacity-70"></i> Export
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-md border border-blue-50 overflow-hidden relative">
            <div class="absolute top-0 left-0 w-1 h-full bg-blue-400"></div>
            
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="font-bold text-xl text-blue-900 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-blue-400"></i> Action Logs
                </h2>
                <span id="resultCount" class="bg-blue-50 text-blue-700 font-bold px-3 py-1 rounded-md text-xs border border-blue-100">0 logs found</span>
            </div>

            <div class="overflow-x-auto max-h-[800px] overflow-y-auto custom-scrollbar p-2">
                <table class="w-full text-left border-collapse min-w-[1000px]">
                    <thead class="sticky top-0 bg-white z-10 shadow-sm">
                        <tr class="border-b border-gray-100 text-xs text-gray-400 uppercase tracking-widest">
                            <th class="p-4 font-bold">Timestamp</th>
                            <th class="p-4 font-bold">Driver / Dept</th>
                            <th class="p-4 font-bold">Action & Task</th>
                            <th class="p-4 font-bold">Destination</th>
                            <th class="p-4 font-bold">Status & Remarks</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTable" class="text-sm divide-y divide-gray-50">
                        <tr><td colspan="5" class="p-12 text-center text-blue-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i><br>Loading database...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
    
    <div id="imageModal" class="fixed inset-0 bg-gray-900/95 hidden items-center justify-center z-[100] p-4 cursor-zoom-out transition-opacity" onclick="closeImageModal()">
        <img id="modalImage" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl border border-gray-700" src="" alt="Handover Proof">
        <button class="absolute top-6 right-8 text-gray-300 hover:text-white text-3xl transition-colors">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    
    <script src="js/app.js"></script>
    
    <script>
        const API_BASE = 'https://iacademy-rfid.onrender.com/api';
        let allLogs = [];
        let filteredLogs = [];
        let allDrivers = [];
        let activeReportStatus = 'All'; // Tracking for Clickable Status Cards

        window.openImageModal = function(src) {
            document.getElementById('modalImage').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
            document.getElementById('imageModal').classList.add('flex');
        }
        
        window.closeImageModal = function() {
            document.getElementById('imageModal').classList.add('hidden');
            document.getElementById('imageModal').classList.remove('flex');
            document.getElementById('modalImage').src = '';
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof renderNavigation === 'function') renderNavigation('reports');
            fetchInitialData();

            $('#reportDateRange').daterangepicker({
                opens: 'right',
                autoUpdateInput: false,
                locale: { format: 'MM/DD/YYYY', cancelLabel: 'Clear' },
                ranges: {
                    'Today': [moment(), moment()],
                    'Yesterday': [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
                    'Month to date': [moment().startOf('month'), moment()],
                    'Last week': [moment().subtract(1, 'week').startOf('week'), moment().subtract(1, 'week').endOf('week')],
                    'Last month': [moment().subtract(1, 'month').startOf('month'), moment().subtract(1, 'month').endOf('month')]
                }
            });

            $('#reportDateRange').on('apply.daterangepicker', function(ev, picker) {
                $(this).val(picker.startDate.format('MM/DD/YYYY') + ' - ' + picker.endDate.format('MM/DD/YYYY'));
            });

            $('#reportDateRange').on('cancel.daterangepicker', function(ev, picker) {
                $(this).val('');
            });
        });

        async function fetchInitialData() {
            try {
                // Fetch Logs and Drivers concurrently
                const [logsRes, driversRes] = await Promise.all([
                    fetch(`${API_BASE}/action-logs`),
                    fetch(`${API_BASE}/drivers`)
                ]);
                
                allLogs = await logsRes.json();
                allDrivers = await driversRes.json();

                // Populate Dropdowns Dynamically
                const driverSelect = document.getElementById('reportDriverFilter');
                allDrivers.forEach(d => driverSelect.innerHTML += `<option value="${d.username}">${d.username}</option>`);

                const departments = ["SHS", "COLLEGE", "REGISTRAR", "ADMISSIONS", "OSAS", "LIBRARY", "CLINIC", "ADMIN", "FINANCE", "PURCHASING", "IT", "ELPD", "ADCOM", "GENERAL"];
                const deptSelect = document.getElementById('reportDeptFilter');
                departments.forEach(dept => deptSelect.innerHTML += `<option value="${dept}">${dept}</option>`);

                renderReportBoard(); // Initial render
            } catch (error) {
                document.getElementById('resultsTable').innerHTML = `<tr><td colspan="5" class="p-12 text-center text-red-500 font-bold">Failed to load database.</td></tr>`;
            }
        }

        // --- NEW CLICKABLE STATUS LOGIC ---
        window.toggleReportStatus = function(status) {
            if (activeReportStatus === status) activeReportStatus = 'All';
            else activeReportStatus = status;
            renderReportBoard(); 
        };

        window.clearReportFilters = function() {
            $('#reportDateRange').val('');
            document.getElementById('reportDeptFilter').value = 'All';
            document.getElementById('reportDriverFilter').value = 'All';
            document.getElementById('reportTaskFilter').value = 'All'; // Changed to 'All'
            activeReportStatus = 'All';
            renderReportBoard();
        };

        window.renderReportBoard = function() {
            const fTask = document.getElementById('reportTaskFilter').value; // Removed .toLowerCase()
            const fDept = document.getElementById('reportDeptFilter').value; 
            const fDriver = document.getElementById('reportDriverFilter').value; 
            
            const isDateSelected = $('#reportDateRange').val() !== '';
            let startBoundary = null, endBoundary = null;

            if (isDateSelected) {
                const datePicker = $('#reportDateRange').data('daterangepicker');
                startBoundary = datePicker.startDate.toDate();
                endBoundary = datePicker.endDate.toDate();
                startBoundary.setHours(0, 0, 0, 0);
                endBoundary.setHours(23, 59, 59, 999);
            }

            // 1. Apply Base Filters (Date, Dept, Driver, Task)
            let baseFilteredLogs = allLogs.filter(log => {
                if (fTask !== 'All' && log.task !== fTask) return false; // Updated logic to match exact dropdown values
                if (fDept !== 'All' && log.department !== fDept) return false;
                if (fDriver !== 'All' && log.driver_name !== fDriver) return false;
                
                if (startBoundary && endBoundary) {
                    const logDate = new Date(log.timestamp);
                    if (logDate < startBoundary || logDate > endBoundary) return false;
                }
                return true;
            });

            // 2. Compute Numbers for the Clickable Cards
            let statComp = 0, statFail = 0, statTrans = 0;
            baseFilteredLogs.forEach(log => {
                if(log.action === "Final Task Handover") {
                    if(log.completion_type === "Completed" || log.completion_type === "Completed_Remarks") statComp++;
                    else if(log.completion_type === "Failed") statFail++;
                } else if(log.action === "Travel Update") {
                    statTrans++;
                }
            });

            document.getElementById('repCountCompleted').innerText = statComp;
            document.getElementById('repCountFailed').innerText = statFail;
            document.getElementById('repCountTransit').innerText = statTrans;

            // 3. Handle Active Button Styling
            document.querySelectorAll('.rep-status-btn').forEach(btn => btn.classList.remove('ring-2', 'ring-offset-2', 'scale-105', 'shadow-md'));
            if (activeReportStatus !== 'All') {
                const activeBtn = document.getElementById(`btn-rep-${activeReportStatus.toLowerCase()}`);
                if (activeBtn) activeBtn.classList.add('ring-2', 'ring-offset-2', 'scale-105', 'shadow-md');
            }

            // 4. Apply Final Status Filter Array Reduction
            filteredLogs = baseFilteredLogs;
            if (activeReportStatus !== 'All') {
                filteredLogs = baseFilteredLogs.filter(log => {
                    if (activeReportStatus === 'Completed') return log.action === "Final Task Handover" && (log.completion_type === "Completed" || log.completion_type === "Completed_Remarks");
                    if (activeReportStatus === 'Failed') return log.action === "Final Task Handover" && log.completion_type === "Failed";
                    if (activeReportStatus === 'Transit') return log.action === "Travel Update";
                    return true;
                });
            }

            // 5. Paint the Table
            renderTableHTML(filteredLogs);
        }

        function renderTableHTML(logs) {
            const tableBody = document.getElementById('resultsTable');
            document.getElementById('resultCount').innerText = `${logs.length} logs found`;

            if (logs.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-gray-400 text-sm italic">No logs match your search criteria.</td></tr>`;
            } else {
                tableBody.innerHTML = logs.map(log => {
                    const dateObj = new Date(log.timestamp);
                    const dateFormatted = dateObj.toISOString().split('T')[0];
                    const timeFormatted = dateObj.toTimeString().split(' ')[0];

                    let statusBadge = `<span class="text-gray-500">${log.delivery_status}</span>`;
                    
                    if(log.action === "Final Task Handover") {
                        if(log.completion_type === "Completed" || log.completion_type === "Completed_Remarks") {
                            statusBadge = `<span class="text-emerald-700 bg-emerald-50 px-2 py-1 rounded border border-emerald-200 font-bold text-[10px] uppercase">${log.delivery_status}</span>`;
                        } else if(log.completion_type === "Failed") {
                            statusBadge = `<span class="text-red-700 bg-red-50 px-2 py-1 rounded border border-red-200 font-bold text-[10px] uppercase">${log.delivery_status}</span>`;
                        }
                    } else if(log.action === "Travel Update") {
                        statusBadge = `<span class="text-blue-700 bg-blue-50 px-2 py-1 rounded border border-blue-200 font-bold text-[10px] uppercase"><i class="fa-solid fa-route mr-1"></i> ${log.delivery_status}</span>`;
                    } else if(log.action === "Started Navigation") {
                        statusBadge = `<span class="text-purple-700 bg-purple-50 px-2 py-1 rounded border border-purple-200 font-bold text-[10px] uppercase"><i class="fa-solid fa-map-pin mr-1"></i> Triggered GPS</span>`;
                    } else if(log.action === "Driver Shift Clock-In") {
                        statusBadge = `<span class="text-green-700 bg-green-50 px-2 py-1 rounded border border-green-200 font-bold text-[10px] uppercase"><i class="fa-solid fa-clock mr-1"></i> Shift Start</span>`;
                    } else if(log.action === "Driver Shift Clock-Out") {
                        statusBadge = `<span class="text-gray-700 bg-gray-200 px-2 py-1 rounded border border-gray-300 font-bold text-[10px] uppercase"><i class="fa-solid fa-stopwatch mr-1"></i> Shift End</span>`;
                    }

                    let comments = log.comments !== "None" ? `<div class="text-[10px] text-gray-400 mt-1 italic">"${log.comments}"</div>` : '';
                    let incompleteReasons = (log.incomplete_reasons && log.incomplete_reasons !== "None") ? `<div class="text-[10px] text-red-500 font-semibold mt-1">Reason: ${log.incomplete_reasons}</div>` : '';

                    let proofHTML = '';
                    if (log.document_attached && log.document_attached !== "None") {
                        try {
                            const images = JSON.parse(log.document_attached);
                            if (Array.isArray(images)) {
                                proofHTML = `<div class="flex flex-wrap gap-1.5 mt-2">` + 
                                    images.map(img => `<img src="${img}" onclick="openImageModal(this.src)" class="w-9 h-9 rounded border border-gray-300 object-cover shadow-sm cursor-zoom-in hover:opacity-75 transition-opacity">`).join('') + 
                                `</div>`;
                            } else {
                                proofHTML = `<div class="mt-2"><img src="${log.document_attached}" onclick="openImageModal(this.src)" class="w-9 h-9 rounded border border-gray-300 object-cover shadow-sm cursor-zoom-in hover:opacity-75 transition-opacity"></div>`;
                            }
                        } catch(e) { 
                            proofHTML = `<div class="mt-2"><img src="${log.document_attached}" onclick="openImageModal(this.src)" class="w-9 h-9 rounded border border-gray-300 object-cover shadow-sm cursor-zoom-in hover:opacity-75 transition-opacity"></div>`;
                        }
                    }

                    // --- NEW: RENDER THE E-SIGNATURE ---
                    let signatureHTML = '';
                    if (log.signature && log.signature !== "None") {
                        signatureHTML = `
                        <div class="mt-3 pt-3 border-t border-gray-100 w-full">
                            <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Recipient E-Signature</p>
                            <img src="${log.signature}" onclick="openImageModal(this.src)" class="h-10 bg-white rounded border border-gray-200 object-contain shadow-sm cursor-zoom-in hover:opacity-75 transition-opacity px-2">
                        </div>`;
                    }

                    let gpsHTML = '';
                    if (log.latitude && log.longitude && log.latitude !== "N/A" && log.longitude !== "N/A") {
                        gpsHTML = `
                        <div class="mt-2">
                            <a href="http://googleusercontent.com/maps.google.com/maps?q=${log.latitude},${log.longitude}" target="_blank" class="inline-flex items-center gap-1.5 text-[10px] font-bold text-blue-600 hover:text-blue-800 hover:underline transition-colors bg-blue-50 px-2 py-1 rounded border border-blue-100">
                                <i class="fa-solid fa-location-crosshairs"></i> ${log.latitude}, ${log.longitude}
                            </a>
                        </div>`;
                    }

                    return `
                    <tr class="hover:bg-blue-50/30 transition-colors border-b border-gray-50">
                        <td class="p-4">
                            <div class="font-bold text-gray-800">${dateFormatted}</div>
                            <div class="text-xs text-gray-500 mt-0.5"><i class="fa-regular fa-clock mr-1"></i> ${timeFormatted}</div>
                        </td>
                        <td class="p-4">
                            <div class="font-bold text-gray-800"><i class="fa-regular fa-user text-blue-400 mr-1"></i> ${log.driver_name}</div>
                            <div class="text-[10px] font-bold text-blue-600 uppercase tracking-widest mt-1">${log.department || 'GENERAL'}</div>
                        </td>
                        <td class="p-4">
                            <div class="font-bold text-blue-900">${log.action}</div>
                            <div class="text-[10px] text-gray-500 mt-1 font-bold uppercase tracking-wider">${log.task}</div>
                        </td>
                        <td class="p-4 font-medium text-gray-600 text-sm">
                            <div class="line-clamp-2" title="${log.location}">${log.location}</div>
                            ${gpsHTML}
                        </td>
                        <td class="p-4">
                            ${statusBadge}
                            ${incompleteReasons}
                            ${comments}
                            ${proofHTML}
                            ${signatureHTML} </td>
                    </tr>`;
                }).join('');
            }
        }
        
        window.exportToExcel = function() {
            if (filteredLogs.length === 0) return alert("No data to export!");
            const exportData = filteredLogs.map(log => ({
                "Date": new Date(log.timestamp).toLocaleDateString(),
                "Time": new Date(log.timestamp).toLocaleTimeString(),
                "Department": log.department || "General",
                "Driver Name": log.driver_name,
                "Plate Number": log.plate_number,
                "Action Type": log.action,
                "Task": log.task,
                "Destination": log.location,
                "Coordinates": (log.latitude && log.latitude !== "N/A") ? `${log.latitude}, ${log.longitude}` : "N/A",
                "Status": log.delivery_status,
                "Result Type": log.completion_type || "N/A",
                "E-Signature": (log.signature && log.signature !== "None") ? "Signed" : "None", 
                "Remarks/Reasons": log.incomplete_reasons !== "None" ? log.incomplete_reasons : "",
                "Comments": log.comments !== "None" ? log.comments : "",
            }));
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Filtered Logs");
            XLSX.writeFile(workbook, `Logistics_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
        }
    </script>
</body>
</html>
