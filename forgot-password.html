<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - iACADEMY RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { blue: '#1e3a8a', bg: '#f8fafc' } } } } }
    </script>
</head>
<body class="bg-brand-bg font-sans min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-r from-blue-800 via-blue-400 to-blue-50 z-0"></div>
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100 relative z-10">
        <div class="p-8 text-center border-b border-gray-100">
            <i class="fa-solid fa-key text-blue-800 text-5xl mb-4"></i>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">Forgot Password</h1>
            <p class="text-gray-500 text-xs font-bold uppercase tracking-widest mt-2">Enter your email to receive a reset link</p>
        </div>
        <form id="forgotForm" class="p-8 space-y-6">
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Email Address</label>
                <input type="email" id="email" required class="w-full border border-gray-200 bg-gray-50 rounded-xl p-3.5 text-sm font-medium outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
            </div>
            <button type="submit" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-4 rounded-xl shadow-md transition-colors text-sm uppercase tracking-wider">Send Reset Link</button>
            <p class="text-center text-xs text-gray-500 mt-6"><a href="login.html" class="text-blue-700 font-bold hover:underline">Back to Login</a></p>
        </form>
    </div>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Sending...`;
            btn.disabled = true;
            try {
                const res = await fetch('https://iacademy-rfid.onrender.com/api/auth/forgot-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value })
                });
                const data = await res.json();
                alert(data.message);
                if (res.ok) window.location.href = 'login.html';
            } catch (err) { alert('Error contacting server.'); }
            finally { btn.innerHTML = 'Send Reset Link'; btn.disabled = false; }
        });
    </script>
</body>
</html>
