<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - iACADEMY RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // 1. Tell Tailwind to use 'class' for dark mode
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { blue: '#1e3a8a', blueHover: '#1e40af', bg: '#f8fafc', border: '#e2e8f0' } }
                }
            }
        }

        // 2. Check local storage for theme preference BEFORE the page renders
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // Theme Toggle Function for standalone pages
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300 font-sans min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    
    <button onclick="toggleTheme()" class="absolute top-6 right-6 z-20 w-10 h-10 flex items-center justify-center rounded-full bg-white/40 hover:bg-white/80 dark:bg-gray-800 dark:hover:bg-gray-700 text-blue-900 dark:text-gray-400 dark:hover:text-yellow-400 text-xl transition-all shadow-sm backdrop-blur-sm">
        <i class="fa-solid fa-moon dark:hidden"></i>
        <i class="fa-solid fa-sun hidden dark:inline"></i>
    </button>

    <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 dark:from-gray-800 dark:via-blue-900 dark:to-gray-900 z-0 transition-colors duration-300"></div>
    <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700 relative z-10 transition-colors duration-300">
        <div class="p-8 text-center bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 transition-colors duration-300">
            <i class="fa-solid fa-key text-blue-800 dark:text-blue-400 text-5xl mb-4 transition-colors"></i>
            <h1 class="text-2xl font-black text-gray-800 dark:text-white tracking-tight transition-colors">Forgot Password</h1>
            <p class="text-gray-500 dark:text-gray-400 text-xs font-bold uppercase tracking-widest mt-2 transition-colors">Enter your email to receive a reset link</p>
        </div>
        <form id="forgotForm" class="p-8 space-y-6">
            <div>
                <label for="email" class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-2 transition-colors">Email Address</label>
                <input type="email" id="email" name="email" autocomplete="email" required class="w-full border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 text-blue-900 dark:text-white rounded-xl p-3.5 text-sm font-medium outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 focus:bg-white dark:focus:bg-gray-900 transition-all">
            </div>
            <button type="submit" class="w-full bg-blue-800 dark:bg-blue-600 hover:bg-blue-900 dark:hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition-colors text-sm uppercase tracking-wider">Send Reset Link</button>
            <p class="text-center text-xs text-gray-500 dark:text-gray-400 mt-6 transition-colors"><a href="login.html" class="text-blue-700 dark:text-blue-400 font-bold hover:underline transition-colors">Back to Login</a></p>
        </form>
    </div>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Sending...`;
            btn.disabled = true;
            try {
                const res = await fetch('https://iacademy-rfid.onrender.com/api/auth/forgot-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value })
                });
                const data = await res.json();
                alert(data.message);
                if (res.ok) window.location.href = 'login.html';
            } catch (err) { alert('Error contacting server.'); }
            finally { btn.innerHTML = 'Send Reset Link'; btn.disabled = false; }
        });
    </script>
</body>
</html>
