<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - iACADEMY RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>

        // 1. Tell Tailwind to use 'class' for dark mode

        tailwind.config = {

            darkMode: 'class', 

            theme: {

                extend: { 

                    fontFamily: { sans: ['Inter', 'sans-serif'] },

                    colors: { brand: { blue: '#1e3a8a', blueHover: '#1e40af', bg: '#f8fafc', border: '#e2e8f0' } }

                }

            }

        }



        // 2. Check local storage for theme preference BEFORE the page renders

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {

            document.documentElement.classList.add('dark');

        } else {

            document.documentElement.classList.remove('dark');

        }

    </script>
</head>
<body class="bg-brand-bg font-sans min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-r from-blue-800 via-blue-400 to-blue-50 z-0"></div>
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-gray-100 relative z-10">
        <div class="p-8 text-center border-b border-gray-100">
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">Reset Password</h1>
            <p class="text-gray-500 text-xs font-bold uppercase tracking-widest mt-2">Enter your new secure password</p>
        </div>
        <form id="resetForm" class="p-8 space-y-6">
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">New Password</label>
                <input type="password" id="password" required class="w-full border border-gray-200 bg-gray-50 rounded-xl p-3.5 text-sm font-medium outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Confirm New Password</label>
                <input type="password" id="confirmPassword" required class="w-full border border-gray-200 bg-gray-50 rounded-xl p-3.5 text-sm font-medium outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
            </div>
            <button type="submit" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-4 rounded-xl shadow-md transition-colors text-sm uppercase tracking-wider">Update Password</button>
        </form>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (!token) { alert('Invalid reset link.'); window.location.href = 'login.html'; }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            if (password !== document.getElementById('confirmPassword').value) return alert('Passwords do not match.');
            
            const btn = e.target.querySelector('button');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Updating...`;
            btn.disabled = true;
            try {
                const res = await fetch('https://iacademy-rfid.onrender.com/api/auth/reset-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                alert(data.message);
                if (res.ok) window.location.href = 'login.html';
            } catch (err) { alert('Error contacting server.'); }
            finally { btn.innerHTML = 'Update Password'; btn.disabled = false; }
        });
    </script>
</body>
</html>
